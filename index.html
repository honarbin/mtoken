ontainer site-container\">\n<div class=\"section-heading\">\n<div class=\"mini\">\n          خدمات ما\n        </div>\n<h2>\n          برای چه کاری به CSR و گواهی دیجیتال نیاز دارید؟\n        </h2>\n<p>\n          دو مسیر اصلی خدمات ما؛\n          ابتدا فرآیندهای مرتبط با سامانه مودیان و سپس\n          گواهی SSL و آماده‌سازی برای سرور.\n        </p>\n</div>\n<div class=\"service-grid\">\n<!-- ================= TAX CARD ================= -->\n<div class=\"service-card primary site-card\">\n<div class=\"service-number\">\n            01\n          </div>\n<div class=\"service-icon\">\n            ✓\n          </div>\n<h3>\n            سامانه مودیان و صورتحساب الکترونیکی\n          </h3>\n<p>\n            اگر برای ارسال صورتحساب‌های الکترونیکی و دریافت\n            شناسه یکتای مالیاتی با کلید عمومی، کلید خصوصی،\n            CSR و گواهی دیجیتال درگیر شده‌اید، بخش فنی فرآیند\n            را به ما بسپارید.\n          </p>\n<ul class=\"service-list\">\n<li>\n              تولید کلید و CSR\n            </li>\n<li>\n              آماده‌سازی اطلاعات موردنیاز درخواست گواهی\n            </li>\n<li>\n              دریافت کد رهگیری\n            </li>\n<li>\n              راهنمایی مراحل احراز هویت در دفتر ثبت‌نام\n            </li>\n<li>\n              راهنمای دریافت و دانلود گواهی\n            </li>\n<li>\n              آماده‌سازی اطلاعات و فایل‌های موردنیاز برای استفاده\n            </li>\n</ul>\n<a class=\"service-contact red\" href=\"tel:09128698052\">\n            ☎ تماس برای خدمات مودیان\n          </a>\n</div>\n<!-- ================= SSL CARD ================= -->\n<div class=\"service-card secondary site-card\">\n<div class=\"service-number\">\n            02\n          </div>\n<div class=\"service-icon\">\n            SSL\n          </div>\n<h3>\n            تولید CSR و آماده‌سازی گواهی SSL\n          </h3>\n<p>\n            برای وب‌سایت‌ها، سامانه‌های سازمانی، سرویس‌های داخلی\n            و سرورهایی که به گواهی SSL نیاز دارند، تولید صحیح CSR\n            و آماده‌سازی فایل‌های گواهی می‌تواند بخش مهمی از\n            فرآیند راه‌اندازی باشد.\n          </p>\n<ul class=\"service-list\">\n<li>\n              تولید CSR متناسب با نیاز سرور\n            </li>\n<li>\n              تنظیم مشخصات درخواست گواهی\n            </li>\n<li>\n              آماده‌سازی CSR برای ثبت درخواست\n            </li>\n<li>\n              بررسی Certificate دریافت‌شده\n            </li>\n<li>\n              آماده‌سازی Certificate Chain\n            </li>\n<li>\n              آماده‌سازی فایل‌ها برای استفاده روی سرور\n            </li>\n</ul>\n<a class=\"service-contact blue\" href=\"tel:09128698052\">\n            ☎ تماس برای خدمات SSL\n          </a>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       TAX SECTION\n  ===================================================== -->\n<section class=\"section tax-section site-section\" id=\"tax\">\n<div class=\"container site-container\">\n<div class=\"tax-grid\">\n<div class=\"tax-content\">\n<div class=\"mini\">\n            خدمات سامانه مودیان\n          </div>\n<h2>\n            برای تولید کلید و CSR\n            درگیر تنظیمات فنی نشوید\n          </h2>\n<p>\n            در فرآیندهای مرتبط با ارسال صورتحساب الکترونیکی و\n            دریافت شناسه یکتای مالیاتی، متقاضی ممکن است با\n            مراحل تولید کلید، CSR و دریافت گواهی دیجیتال مواجه شود.\n            ما بخش فنی این مسیر را برای شما آماده می‌کنیم.\n          </p>\n<div class=\"tax-points\">\n<div class=\"tax-point\">\n<div class=\"tax-point-icon\">\n                ✓\n              </div>\n<div>\n<strong>\n                  تولید کلید و CSR\n                </strong>\n<span>\n                  آماده‌سازی اطلاعات موردنیاز برای ثبت درخواست\n                </span>\n</div>\n</div>\n<div class=\"tax-point\">\n<div class=\"tax-point-icon\">\n                ✓\n              </div>\n<div>\n<strong>\n                  دریافت کد رهگیری\n                </strong>\n<span>\n                  آماده‌سازی درخواست برای ادامه فرآیند\n                </span>\n</div>\n</div>\n<div class=\"tax-point\">\n<div class=\"tax-point-icon\">\n                ✓\n              </div>\n<div>\n<strong>\n                  احراز هویت و دریافت گواهی\n                </strong>\n<span>\n                  راهنمایی متقاضی برای مراجعه به دفتر ثبت‌نام\n                </span>\n</div>\n</div>\n<div class=\"tax-point\">\n<div class=\"tax-point-icon\">\n                ✓\n              </div>\n<div>\n<strong>\n                  آماده‌سازی برای استفاده\n                </strong>\n<span>\n                  راهنمایی درباره فایل‌ها و اطلاعات موردنیاز\n                </span>\n</div>\n</div>\n</div>\n<div class=\"tax-call\">\n<a class=\"btn site-btn\" href=\"tel:09128698052\">\n              ☎ برای شروع با کارشناسان تماس بگیرید\n            </a>\n</div>\n</div>\n<div>\n<div class=\"process-grid\">\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                ۱\n              </div>\n<h4>\n                بررسی نیاز\n              </h4>\n<p>\n                نوع گواهی و کاربرد آن توسط کارشناس بررسی می‌شود.\n              </p>\n</div>\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                ۲\n              </div>\n<h4>\n                تولید CSR\n              </h4>\n<p>\n                کلید و CSR مطابق اطلاعات موردنیاز آماده می‌شود.\n              </p>\n</div>\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                ۳\n              </div>\n<h4>\n                کد رهگیری\n              </h4>\n<p>\n                اطلاعات لازم برای ثبت درخواست و ادامه فرآیند ارائه می‌شود.\n              </p>\n</div>\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                ۴\n              </div>\n<h4>\n                دریافت گواهی\n              </h4>\n<p>\n                متقاضی پس از احراز هویت، گواهی خود را دریافت می‌کند.\n              </p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       CSR EXPLANATION\n  ===================================================== -->\n<section class=\"section site-section\">\n<div class=\"container site-container\">\n<div class=\"explain-grid\">\n<div class=\"csr-visual\">\n<strong>\n            Certificate Signing Request\n          </strong>\n<div class=\"csr-code\">\n<span>\n              -----BEGIN CERTIFICATE REQUEST-----\n            </span>\n<br/>\n<span>\n              MIICxDCCAa0CAQAwgY4xCzAJBgNVBAYT...\n            </span>\n<br/>\n<span>\n              Public Key Information\n            </span>\n<br/>\n<span>\n              Subject Information\n            </span>\n<br/>\n<span>\n              Signature Algorithm\n            </span>\n<br/>\n<span>\n              -----END CERTIFICATE REQUEST-----\n            </span>\n</div>\n<figure class=\"mtoken-image-placeholder mtoken-image-csr-process\">\n<img alt=\"نمای مراحل تولید درخواست CSR\" decoding=\"async\" height=\"650\" loading=\"lazy\" src=\"assets/images/placeholders/csr-process.svg\" width=\"1400\"/>\n<figcaption>محل پیشنهادی تصویر: نمای مراحل تولید درخواست CSR — 1400×650 پیکسل</figcaption>\n</figure></div>\n<div class=\"explain-content\">\n<h2>\n            CSR چیست و چرا باید درست تولید شود؟\n          </h2>\n<p>\n            CSR یا Certificate Signing Request، درخواست صدور گواهی\n            دیجیتال است که اطلاعات لازم برای صدور گواهی و کلید عمومی\n            را در خود دارد.\n          </p>\n<p>\n            تولید CSR صرفاً ساختن یک فایل نیست. نوع الگوریتم،\n            ساختار کلید، مشخصات درخواست و نحوه نگهداری کلید خصوصی\n            می‌تواند روی ادامه فرآیند و استفاده از گواهی تأثیر داشته باشد.\n          </p>\n<div class=\"info-box\">\n<strong>\n              نکته امنیتی:\n            </strong>\n\n            کلید خصوصی اطلاعات حساسی است و باید به‌صورت امن نزد\n            مالک گواهی نگهداری شود. کنترل و حفاظت از کلید خصوصی\n            باید در تمام مراحل حفظ شود.\n\n          </div>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       SSL SECTION\n  ===================================================== -->\n<section class=\"section ssl-section site-section\" id=\"ssl\">\n<div class=\"container site-container\">\n<div class=\"section-heading\">\n<div class=\"mini\">\n          خدمات SSL\n        </div>\n<h2>\n          تولید CSR و آماده‌سازی گواهی SSL برای سرور\n        </h2>\n<p>\n          برای وب‌سایت‌ها، سامانه‌های سازمانی، سرویس‌های داخلی،\n          مجموعه‌های بانکی و سایر سرویس‌هایی که برای ثبت درخواست\n          یا استفاده از گواهی SSL به آماده‌سازی فنی نیاز دارند.\n        </p>\n</div>\n<div class=\"ssl-grid\">\n<div class=\"ssl-main\">\n<h3>\n            از تولید CSR تا آماده‌سازی Certificate\n          </h3>\n<p>\n            بسیاری از وب‌سایت‌ها و سرویس‌های داخلی، به‌خصوص در\n            شرایطی که استفاده از برخی گواهی‌های خارجی با محدودیت‌ها\n            و مسائل مربوط به تحریم مواجه است، از گواهی‌های صادرشده\n            توسط مراجع داخلی استفاده می‌کنند.\n          </p>\n<p>\n            در این فرآیند، تولید صحیح CSR برای ثبت درخواست گواهی\n            اهمیت زیادی دارد. پس از دریافت گواهی نیز ممکن است\n            آماده‌سازی فایل Certificate و زنجیره گواهی برای استفاده\n            روی سرور موردنیاز باشد.\n          </p>\n<div class=\"ssl-list\">\n<div class=\"ssl-item\">\n<strong>\n                تولید CSR\n              </strong>\n<span>\n                تولید درخواست گواهی متناسب با مشخصات سرویس و سرور.\n              </span>\n</div>\n<div class=\"ssl-item\">\n<strong>\n                ثبت درخواست گواهی\n              </strong>\n<span>\n                آماده‌سازی CSR و اطلاعات لازم برای ثبت درخواست.\n              </span>\n</div>\n<div class=\"ssl-item\">\n<strong>\n                بررسی Certificate\n              </strong>\n<span>\n                بررسی گواهی دریافت‌شده و تطبیق آن با درخواست.\n              </span>\n</div>\n<div class=\"ssl-item\">\n<strong>\n                Certificate Chain\n              </strong>\n<span>\n                آماده‌سازی زنجیره گواهی و Intermediate در صورت نیاز.\n              </span>\n</div>\n<div class=\"ssl-item\">\n<strong>\n                آماده‌سازی فرمت\n              </strong>\n<span>\n                آماده‌سازی فایل‌ها متناسب با محیط سرور.\n              </span>\n</div>\n<div class=\"ssl-item\">\n<strong>\n                راهنمای نصب\n              </strong>\n<span>\n                راهنمایی برای استفاده و نصب گواهی در محیط مربوطه.\n              </span>\n</div>\n</div>\n<div class=\"ssl-contact\">\n<span>\n              برای بررسی نیاز سرور و نوع گواهی، با کارشناس تماس بگیرید.\n            </span>\n<a href=\"tel:09128698052\">\n              ☎ تماس با کارشناس SSL\n            </a>\n</div>\n</div>\n<div class=\"ssl-side\">\n<h3>\n            چه مجموعه‌هایی به این خدمت نیاز دارند؟\n          </h3>\n<p>\n            اگر برای وب‌سایت یا سرویس سازمانی خود به گواهی SSL\n            نیاز دارید و تولید CSR یا آماده‌سازی فایل‌های گواهی\n            برای سرور برایتان پیچیده است، می‌توانید این بخش را\n            برون‌سپاری کنید.\n          </p>\n<ul class=\"service-list\">\n<li>\n              وب‌سایت‌ها و فروشگاه‌های اینترنتی\n            </li>\n<li>\n              سامانه‌های سازمانی و داخلی\n            </li>\n<li>\n              شرکت‌ها و مجموعه‌های دارای سرور\n            </li>\n<li>\n              سرویس‌های تحت وب و API\n            </li>\n<li>\n              سامانه‌های بانکی و سازمانی\n            </li>\n<li>\n              مدیران شبکه و سرور\n            </li>\n</ul>\n<div class=\"server-box\">\n<strong>\n              گواهی را دریافت کرده‌اید اما برای سرور آماده نیست؟\n            </strong>\n<p>\n              اگر Certificate را دریافت کرده‌اید اما برای تبدیل،\n              ترکیب، آماده‌سازی Chain یا تنظیم فایل‌ها برای استفاده\n              در سرور نیاز به کمک دارید، با کارشناسان ما تماس بگیرید.\n            </p>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       WHY US\n  ===================================================== -->\n<section class=\"section site-section\">\n<div class=\"container site-container\">\n<div class=\"section-heading\">\n<div class=\"mini\">\n          مزیت خدمت\n        </div>\n<h2>\n          لازم نیست درگیر تنظیمات فنی شوید\n        </h2>\n<p>\n          کافی است نیازتان را مطرح کنید؛ کارشناسان مسیر فنی\n          مناسب را بررسی و راهنمایی می‌کنند.\n        </p>\n</div>\n<div class=\"why-grid\">\n<div class=\"why-card site-card\">\n<div class=\"why-icon\">\n            01\n          </div>\n<h4>\n            کاهش خطاهای فنی\n          </h4>\n<p>\n            تولید CSR و آماده‌سازی فایل‌های گواهی با توجه به\n            کاربرد موردنظر انجام می‌شود.\n          </p>\n</div>\n<div class=\"why-card site-card\">\n<div class=\"why-icon\">\n            02\n          </div>\n<h4>\n            صرفه‌جویی در زمان\n          </h4>\n<p>\n            لازم نیست برای پیدا کردن دستورهای OpenSSL یا تنظیمات\n            پیچیده سرور وقت زیادی صرف کنید.\n          </p>\n</div>\n<div class=\"why-card site-card\">\n<div class=\"why-icon\">\n            03\n          </div>\n<h4>\n            راهنمایی مرحله‌به‌مرحله\n          </h4>\n<p>\n            از بررسی نیاز تا تولید CSR، دریافت گواهی و آماده‌سازی\n            برای استفاده، مسیر کار برای شما مشخص می‌شود.\n          </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       SECURITY\n  ===================================================== -->\n<section class=\"section site-section\">\n<div class=\"container site-container\">\n<div class=\"security\">\n<div class=\"security-icon\">\n          !\n        </div>\n<div>\n<h3>\n            امنیت کلید خصوصی را جدی بگیرید\n          </h3>\n<p>\n            کلید خصوصی بخش حساس فرآیند است و نباید در اختیار افراد\n            غیرمجاز قرار بگیرد. فرآیند تولید و استفاده از کلید باید\n            به‌گونه‌ای انجام شود که کنترل و نگهداری امن کلید خصوصی\n            نزد مالک گواهی حفظ شود.\n          </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       FAQ\n  ===================================================== -->\n<section class=\"section gray site-section\">\n<div class=\"container site-container\">\n<div class=\"section-heading\">\n<div class=\"mini\">\n          سؤالات متداول\n        </div>\n<h2>\n          قبل از تماس چه چیزی بدانم؟\n        </h2>\n</div>\n<div class=\"faq\">\n<details>\n<summary>\n            برای شروع فرآیند چه کاری باید انجام دهم؟\n          </summary>\n<p>\n            کافی است با کارشناسان تماس بگیرید و کاربرد گواهی خود\n            را اعلام کنید؛ برای مثال سامانه مودیان، دریافت شناسه\n            یکتای مالیاتی، SSL وب‌سایت یا استفاده روی سرور.\n            سپس نوع گواهی و مراحل موردنیاز بررسی می‌شود.\n          </p>\n</details>\n<details>\n<summary>\n            برای سامانه مودیان چه خدماتی ارائه می‌شود؟\n          </summary>\n<p>\n            بسته به فرآیند موردنیاز، خدمات می‌تواند شامل تولید کلید\n            و CSR، آماده‌سازی اطلاعات درخواست، دریافت کد رهگیری،\n            راهنمایی مراحل احراز هویت و دریافت گواهی و راهنمایی\n            برای استفاده از اطلاعات و فایل‌های مربوطه باشد.\n          </p>\n</details>\n<details>\n<summary>\n            آیا گواهی مودیان را شما صادر می‌کنید؟\n          </summary>\n<p>\n            صدور نهایی گواهی توسط مرجع صادرکننده و پس از طی فرآیند\n            مربوط به احراز هویت انجام می‌شود. خدمات ما بر تولید\n            کلید و CSR، آماده‌سازی درخواست، دریافت کد رهگیری و\n            راهنمایی مراحل دریافت گواهی متمرکز است.\n          </p>\n</details>\n<details>\n<summary>\n            برای SSL چه خدماتی دریافت می‌کنم؟\n          </summary>\n<p>\n            تولید CSR، آماده‌سازی درخواست، بررسی گواهی دریافت‌شده،\n            آماده‌سازی Certificate Chain و فایل‌های موردنیاز برای\n            استفاده روی سرور و راهنمایی نصب از جمله خدمات قابل ارائه است.\n          </p>\n</details>\n<details>\n<summary>\n            اگر گواهی SSL را قبلاً دریافت کرده باشم چه؟\n          </summary>\n<p>\n            در این حالت نیز می‌توانید با کارشناسان تماس بگیرید.\n            در صورت نیاز، Certificate، Chain و فایل‌های مربوطه\n            بررسی و برای محیط سرور آماده می‌شوند.\n          </p>\n</details>\n<details>\n<summary>\n            آیا لازم است کلید خصوصی را برای شما ارسال کنم؟\n          </summary>\n<p>\n            کلید خصوصی اطلاعات بسیار حساسی است و اصل بر این است که\n            نزد مالک گواهی به‌صورت امن نگهداری شود. قبل از هرگونه\n            انتقال یا استفاده از کلید خصوصی، نحوه انجام کار باید\n            با توجه به شرایط فنی و امنیتی بررسی شود.\n          </p>\n</details>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       FINAL CTA\n  ===================================================== -->\n<section class=\"final-cta\">\n<div class=\"container site-container\">\n<div class=\"cta-box\">\n<div class=\"cta-icon\">\n          ☎\n        </div>\n<h2>\n          نمی‌دانید دقیقاً چه گواهی یا CSR نیاز دارید؟\n        </h2>\n<p>\n          لازم نیست از ابتدا با اصطلاحات فنی درگیر شوید.\n          کاربرد خود را برای ما توضیح دهید؛ کارشناسان بررسی می‌کنند\n          چه مراحلی برای شما لازم است و از کجا باید شروع کنید.\n        </p>\n<div class=\"cta-buttons\">\n<!-- شماره تماس -->\n<a class=\"btn btn-primary site-btn site-btn--primary\" href=\"tel:09128698052\">\n            ☎ تماس با کارشناسان\n          </a>\n<!-- صفحه پشتیبانی -->\n<a class=\"btn btn-outline site-btn site-btn--outline\" href=\"/support/\">\n            پشتیبانی آنلاین\n          </a>\n</div>\n<div class=\"cta-note\">\n          سامانه مودیان · شناسه یکتای مالیاتی · CSR · SSL · آماده‌سازی گواهی سرور\n        </div>\n</ ر صورت انقضای گواهی، ممکن است امکان تمدید وجود نداشته باشد\n            و لازم باشد فرآیند صدور گواهی دیجیتال جدید انجام شود.\n          </div>\n</details>\n<details>\n<summary>\n            آیا برای تمدید نیاز به احراز هویت است؟\n          </summary>\n<div class=\"faq-answer\">\n            بسته به نوع گواهی و فرآیند مربوطه، ممکن است احراز هویت\n            برای تمدید مورد نیاز باشد.\n          </div>\n</details>\n<details>\n<summary>\n            آیا توکن قبلی برای تمدید قابل استفاده است؟\n          </summary>\n<div class=\"faq-answer\">\n            در صورت سازگاری توکن و شرایط گواهی، ممکن است امکان استفاده\n            از همان توکن وجود داشته باشد. شرایط دقیق به نوع گواهی\n            و زیرساخت صدور آن بستگی دارد.\n          </div>\n</details>\n<details>\n<summary>\n            اگر گواهی من منقضی شده باشد چه کار کنم؟\n          </summary>\n<div class=\"faq-answer\">\n            ابتدا وضعیت گواهی بررسی شود. اگر شرایط تمدید وجود نداشته باشد،\n            می‌توان فرآیند صدور گواهی دیجیتال جدید را انجام داد.\n          </div>\n</details>\n</div>\n</div>\n</section>\n<!-- ================= FINAL CTA ================= -->\n<section class=\"cta-section\">\n<div class=\"container site-container\">\n<div class=\"cta\">\n<div class=\"cta-content\">\n<h2>\n            گواهی دیجیتال خود را قبل از انقضا تمدید کنید\n          </h2>\n<p>\n            اجازه ندهید پایان اعتبار گواهی باعث توقف کار شما شود.\n          </p>\n</div>\n<a class=\"btn site-btn\" href=\"#\">\n          شروع تمدید گواهی\n          ←\n        </a>\n</div>\n</div>\n</section>\n</div>\n<!-- /wp:html -->\n","issue-certifiate":"<!-- wp:html -->\n<div class=\"mtoken-gutenberg-page mtoken-page-issue-certifiate\">\n<div class=\"mtoken-certificate-page\">\n<div class=\"mtc-container container site-container\">\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     BREADCRUMB\n========================= -->\n<div class=\"mtc-breadcrumb\">\n    صفحه اصلی\n    <span>←</span>\n    خدمات\n    <span>←</span>\n    صدور گواهی امضای دیجیتال\n</div>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     HERO\n========================= -->\n<section class=\"mtc-hero\">\n<div class=\"mtc-hero-content\">\n<div class=\"mtc-label section-label site-label site-section-label\">\n<span class=\"mtc-label-dot\"></span>\n            خدمات صدور گواهی دیجیتال\n        </div>\n<h1>\n            صدور <strong>گواهی امضای دیجیتال</strong>\n</h1>\n<p class=\"mtc-hero-description\">\n            ثبت درخواست، احراز هویت و دریافت گواهی امضای دیجیتال\n            برای استفاده در سامانه‌های دولتی، تجاری و سازمانی.\n            از انتخاب نوع گواهی تا راه‌اندازی و استفاده، در کنار شما هستیم.\n        </p>\n<div class=\"mtc-hero-buttons\">\n<a class=\"mtc-btn btn mtc-btn-red btn-primary site-btn site-btn--primary\" href=\"#request\">\n                درخواست صدور گواهی\n            </a>\n<a class=\"mtc-btn btn mtc-btn-light btn-outline site-btn site-btn--outline\" href=\"#consultation\">\n                مشاوره و راهنمایی\n            </a>\n</div>\n</div>\n<figure class=\"mtoken-image-placeholder mtoken-image-issue-hero\">\n<img alt=\"تصویر فرآیند صدور گواهی امضای دیجیتال\" decoding=\"async\" height=\"850\" loading=\"eager\" src=\"assets/images/placeholders/issue-hero.svg\" width=\"1200\"/>\n<figcaption>محل پیشنهادی تصویر: تصویر فرآیند صدور گواهی امضای دیجیتال — 1200×850 پیکسل</figcaption>\n</figure></section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     INTRO\n========================= -->\n<section class=\"mtc-section section site-section\" id=\"request\">\n<div class=\"mtc-intro\">\n<div class=\"mtc-white-card\">\n<p>\n                برای استفاده از خدمات و سامانه‌هایی که نیاز به\n                <strong>امضای دیجیتال</strong> دارند، ابتدا باید\n                گواهی امضای دیجیتال متناسب با نوع فعالیت و کاربرد\n                خود را دریافت کنید.\n            </p>\n<p style=\"margin-top:15px;\">\n                در این خدمت، مراحل ثبت درخواست گواهی، احراز هویت،\n                صدور گواهی امضای دیجیتال و راه‌اندازی آن انجام می‌شود\n                و در صورت نیاز، کارشناسان ما برای انتخاب نوع گواهی\n                و راه‌اندازی آن در کنار شما خواهند بود.\n            </p>\n<div class=\"mtc-highlight\">\n<strong>اگر نمی‌دانید چه نوع گواهی برای شما مناسب است،</strong>\n                قبل از ثبت درخواست با کارشناسان ما مشورت کنید.\n            </div>\n</div>\n<div class=\"mtc-side-card\">\n<div class=\"mtc-side-icon\">\n                ✓\n            </div>\n<h3>\n                از درخواست تا استفاده\n            </h3>\n<p>\n                فرآیند دریافت گواهی تنها به صدور آن محدود نمی‌شود.\n                در صورت نیاز، راهنمایی‌های لازم برای راه‌اندازی\n                و استفاده از گواهی در اختیار شما قرار می‌گیرد.\n            </p>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     WHAT IS CERTIFICATE\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            گواهی امضای دیجیتال چیست؟\n        </h2>\n<p>\n            آشنایی با نقش گواهی دیجیتال در فرآیندهای الکترونیکی\n        </p>\n</div>\n<div class=\"mtc-white-card\">\n<p>\n            گواهی امضای دیجیتال یک گواهی الکترونیکی است که برای ایجاد\n            و استفاده از <strong>امضای دیجیتال معتبر</strong> در محیط‌های\n            الکترونیکی مورد استفاده قرار می‌گیرد.\n        </p>\n<p style=\"margin-top:15px;\">\n            با استفاده از گواهی امضای دیجیتال می‌توان هویت صاحب گواهی\n            را در فرآیندهای الکترونیکی شناسایی و اسناد و تراکنش‌های\n            دیجیتال را با اطمینان بیشتری امضا کرد.\n        </p>\n<p style=\"margin-top:15px;\">\n            بسیاری از سامانه‌های دولتی، تجاری و سازمانی برای انجام\n            برخی خدمات الکترونیکی به گواهی امضای دیجیتال نیاز دارند.\n        </p>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     AUDIENCE\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            چه کسانی به گواهی امضای دیجیتال نیاز دارند؟\n        </h2>\n<p>\n            گواهی دیجیتال برای گروه‌های مختلفی از کاربران کاربرد دارد.\n        </p>\n</div><figure class=\"mtoken-image-placeholder mtoken-image-issue-process\">\n<img alt=\"تصویر مراحل صدور گواهی امضای دیجیتال\" decoding=\"async\" height=\"650\" loading=\"lazy\" src=\"assets/images/placeholders/issue-process.svg\" width=\"1400\"/>\n<figcaption>محل پیشنهادی تصویر: تصویر مراحل صدور گواهی امضای دیجیتال — 1400×650 پیکسل</figcaption>\n</figure>\n<div class=\"mtc-audience-grid\">\n<div class=\"mtc-audience\">\n<div class=\"mtc-audience-icon\">♙</div>\n<h3>\n                اشخاص حقیقی\n            </h3>\n<p>\n                افرادی که برای انجام امور شخصی، تجاری یا اداری\n                خود در سامانه‌های نیازمند امضای دیجیتال فعالیت می‌کنند.\n            </p>\n</div>\n<div class=\"mtc-audience\">\n<div class=\"mtc-audience-icon\">♙</div>\n<h3>\n                اشخاص حقیقی وابسته\n            </h3>\n<p>\n                کارکنان، نمایندگان یا افرادی که به نمایندگی از\n                یک شرکت یا سازمان فرآیندهای الکترونیکی انجام می‌دهند.\n            </p>\n</div>\n<div class=\"mtc-audience\">\n<div class=\"mtc-audience-icon\">▤</div>\n<h3>\n                اشخاص حقوقی\n            </h3>\n<p>\n                شرکت‌ها و سازمان‌هایی که برای امور الکترونیکی،\n                ثبت اسناد، معاملات یا سامانه‌های سازمانی نیاز دارند.\n            </p>\n</div>\n<div class=\"mtc-audience\">\n<div class=\"mtc-audience-icon\">⌂</div>\n<h3>\n                صاحبان کسب‌وکار\n            </h3>\n<p>\n                کسب‌وکارهایی که برای استفاده از خدمات الکترونیکی،\n                سامانه‌های دولتی و تجاری به گواهی معتبر نیاز دارند.\n            </p>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     PROCESS\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            مراحل صدور گواهی امضای دیجیتال\n        </h2>\n<p>\n            فرآیند دریافت گواهی شامل چند مرحله اصلی است.\n        </p>\n</div><figure class=\"mtoken-image-placeholder mtoken-image-issue-requirements\">\n<img alt=\"تصویر نمادین مدارک و پیش‌نیازهای صدور گواهی\" decoding=\"async\" height=\"700\" loading=\"lazy\" src=\"assets/images/placeholders/issue-requirements.svg\" width=\"1000\"/>\n<figcaption>محل پیشنهادی تصویر: تصویر نمادین مدارک و پیش‌نیازهای صدور گواهی — 1000×700 پیکسل</figcaption>\n</figure>\n<div class=\"mtc-process\">\n<div class=\"mtc-process-item\">\n<div class=\"mtc-process-number\">\n                ۱\n            </div>\n<h3>\n                ثبت درخواست\n            </h3>\n<p>\n                اطلاعات مورد نیاز ثبت و نوع گواهی متناسب با نیاز\n                متقاضی مشخص می‌شود.\n            </p>\n</div>\n<div class=\"mtc-process-item\">\n<div class=\"mtc-process-number\">\n                ۲\n            </div>\n<h3>\n                بررسی اطلاعات\n            </h3>\n<p>\n                اطلاعات و مدارک مورد نیاز بررسی می‌شود تا درخواست\n                برای ادامه فرآیند آماده باشد.\n            </p>\n</div>\n<div class=\"mtc-process-item\">\n<div class=\"mtc-process-number\">\n                ۳\n            </div>\n<h3>\n                احراز هویت\n            </h3>\n<p>\n                هویت متقاضی مطابق فرآیند تعیین‌شده بررسی و تأیید می‌شود.\n            </p>\n</div>\n<div class=\"mtc-process-item\">\n<div class=\"mtc-process-number\">\n                ۴\n            </div>\n<h3>\n                صدور گواهی\n            </h3>\n<p>\n                پس از تکمیل مراحل و تأیید اطلاعات، گواهی صادر می‌شود.\n            </p>\n</div>\n<div class=\"mtc-process-item\">\n<div class=\"mtc-process-number\">\n                ۵\n            </div>\n<h3>\n                راه‌اندازی\n            </h3>\n<p>\n                گواهی برای استفاده در سیستم، توکن یا سامانه موردنظر\n                آماده می‌شود.\n            </p>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     TYPES\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            انواع گواهی امضای دیجیتال\n        </h2>\n<p>\n            نوع گواهی باید بر اساس شخص، وابستگی سازمانی و کاربرد انتخاب شود.\n        </p>\n</div>\n<div class=\"mtc-types\">\n<div class=\"mtc-type\">\n<div class=\"mtc-type-top\">\n<div class=\"mtc-type-icon\">\n                    ♙\n                </div>\n<h3>\n                    گواهی شخص حقیقی مستقل\n                </h3>\n</div>\n<p>\n                برای اشخاص حقیقی که گواهی را برای استفاده شخصی\n                و مستقل دریافت می‌کنند.\n            </p>\n</div>\n<div class=\"mtc-type\">\n<div class=\"mtc-type-top\">\n<div class=\"mtc-type-icon\">\n                    ♙\n                </div>\n<h3>\n                    گواهی شخص حقیقی وابسته\n                </h3>\n</div>\n<p>\n                برای افرادی که گواهی آنها در ارتباط با یک شرکت،\n                سازمان یا مجموعه مشخص صادر می‌شود.\n            </p>\n</div>\n<div class=\"mtc-type\">\n<div class=\"mtc-type-top\">\n<div class=\"mtc-type-icon\">\n                    ▤\n                </div>\n<h3>\n                    گواهی اشخاص حقوقی\n                </h3>\n</div>\n<p>\n                برای شرکت‌ها و اشخاص حقوقی که برای انجام\n                فرآیندهای الکترونیکی به گواهی معتبر نیاز دارند.\n            </p>\n</div>\n<div class=\"mtc-type\">\n<div class=\"mtc-type-top\">\n<div class=\"mtc-type-icon\">\n                    ◉\n                </div>\n<h3>\n                    مهر سازمانی\n                </h3>\n</div>\n<p>\n                برای سازمان‌ها و شرکت‌ها در فرآیندهایی که نیاز\n                به هویت و مهر الکترونیکی سازمان دارند.\n            </p>\n<div class=\"mtc-type-note\">\n                انتخاب نوع گواهی باید بر اساس کاربرد واقعی شما انجام شود.\n            </div>\n</div>\n</div>\n<div class=\"mtc-highlight\" style=\"margin-top:17px;\">\n<strong>در انتخاب نوع گواهی مطمئن نیستید؟</strong>\n        قبل از ثبت درخواست با کارشناسان ما مشورت کنید تا بر اساس\n        سامانه و کاربرد موردنظر، گزینه مناسب مشخص شود.\n    </div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     SYSTEMS\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            گواهی امضای دیجیتال در چه سامانه‌هایی استفاده می‌شود؟\n        </h2>\n<p>\n            برخی از کاربردهای رایج گواهی دیجیتال\n        </p>\n</div>\n<div class=\"mtc-systems\">\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                ◈\n            </div>\n<h3>\n                سامانه مودیان\n            </h3>\n<p>\n                استفاده از روش‌های امضای موردنیاز در فرآیندهای مرتبط.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                ⌘\n            </div>\n<h3>\n                سامانه جامع تجارت\n            </h3>\n<p>\n                انجام برخی فرآیندهای تجاری و الکترونیکی نیازمند امضا.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                ▣\n            </div>\n<h3>\n                سامانه ثبت من\n            </h3>\n<p>\n                استفاده از گواهی در برخی فرآیندهای خدمات ثبتی.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                ▤\n            </div>\n<h3>\n                سامانه ستاد ایران\n            </h3>\n<p>\n                کاربرد امضای دیجیتال در برخی فرآیندهای سامانه.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                ◇\n            </div>\n<h3>\n                سامانه کاتب\n            </h3>\n<p>\n                استفاده از گواهی در فرآیندهای الکترونیکی مرتبط.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                +\n            </div>\n<h3>\n                خدمات ثبتی\n            </h3>\n<p>\n                برخی فرآیندهای ثبت شرکت‌ها و خدمات ثبتی.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                $\n            </div>\n<h3>\n                سامانه‌های تجاری\n            </h3>\n<p>\n                برخی خدمات تجاری و سازمانی نیازمند امضای دیجیتال.\n            </p>\n</div>\n<div class=\"mtc-system\">\n<div class=\"mtc-system-icon\">\n                ✓\n            </div>\n<h3>\n                سامانه‌های سازمانی\n            </h3>\n<p>\n                هر سامانه‌ای که زیرساخت امضای دیجیتال را پشتیبانی کند.\n            </p>\n</div>\n</div>\n<div class=\"mtc-highlight\" style=\"margin-top:18px;\">\n        اگر برای استفاده از یک سامانه مشخص به گواهی امضای دیجیتال\n        نیاز دارید، می‌توانید پیش از ثبت درخواست، نوع گواهی و\n        تجهیزات موردنیاز را از کارشناسان ما استعلام کنید.\n    </div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     TOKEN K3\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-token\">\n<div class=\"mtc-token-content\">\n<h2>\n                آیا برای دریافت گواهی به توکن نیاز دارم؟\n            </h2>\n<p>\n                این موضوع به نوع گواهی و روش استفاده شما بستگی دارد.\n                در صورتی که استفاده از توکن سخت‌افزاری برای شما موردنیاز\n                باشد، می‌توانید توکن امضای دیجیتال K3 را نیز تهیه کنید.\n            </p>\n<div class=\"mtc-token-list\">\n<div>\n                    نگهداری امن گواهی دیجیتال\n                </div>\n<div>\n                    استفاده از امضای دیجیتال در سیستم‌های سازگار\n                </div>\n<div>\n                    امکان راه‌اندازی و استفاده در فرآیندهای موردنیاز\n                </div>\n<div>\n                    پشتیبانی از فرآیندهای مبتنی بر توکن سخت‌افزاری\n                </div>\n</div>\n</div>\n<div class=\"mtc-token-card\">\n<div class=\"mtc-token-card-content\">\n<h3>\n                    توکن امضای دیجیتال K3\n                </h3>\n<p>\n                    اگر هنوز توکن ندارید، می‌توانید هم‌زمان با دریافت\n                    خدمات صدور گواهی، توکن موردنیاز خود را تهیه کنید.\n                </p>\n<span class=\"mtc-token-badge\">\n                    مناسب برای نگهداری گواهی دیجیتال\n                </span>\n<br/>\n<a class=\"mtc-token-link\" href=\"/product/توکن-mtoken-k3/\">\n                    مشاهده و خرید توکن K3\n                </a>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     SUPPORT\n========================= -->\n<section class=\"mtc-section section site-section\" id=\"consultation\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            صدور گواهی امضای دیجیتال با پشتیبانی تخصصی\n        </h2>\n<p>\n            از ثبت درخواست تا راه‌اندازی و استفاده از گواهی\n        </p>\n</div>\n<div class=\"mtc-support\">\n<div class=\"mtc-support-card\">\n<h3>\n                خدمات تخصصی ما\n            </h3>\n<p>\n                دریافت گواهی دیجیتال فقط به صدور گواهی محدود نمی‌شود.\n                در صورت نیاز، در مراحل راه‌اندازی و استفاده نیز\n                همراه شما خواهیم بود.\n            </p>\n<div class=\"mtc-support-list\">\n<span>\n                    راهنمایی برای انتخاب نوع گواهی\n                </span>\n<span>\n                    ثبت و پیگیری درخواست\n                </span>\n<span>\n                    راهنمایی فرآیند احراز هویت\n                </span>\n<span>\n                    صدور و تمدید گواهی\n                </span>\n<span>\n                    راه‌اندازی توکن K3\n                </span>\n</div>\n</div>\n<div class=\"mtc-support-card\">\n<h3>\n                راه‌اندازی و پشتیبانی\n            </h3>\n<p>\n                پس از دریافت گواهی، در صورت نیاز می‌توانید برای\n                نصب نرم‌افزار، Middleware، درایور، تنظیمات توکن\n                و استفاده از گواهی در سامانه‌ها راهنمایی دریافت کنید.\n            </p>\n<div class=\"mtc-support-list\">\n<span>\n                    نصب Middleware و Driver\n                </span>\n<span>\n                    تنظیمات موردنیاز سامانه‌ها\n                </span>\n<span>\n                    پشتیبانی تخصصی امضای دیجیتال\n                </span>\n<span>\n                    راهنمایی استفاده از گواهی\n                </span>\n<span>\n                    خدمات VIP برای همراهی تخصصی\n                </span>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     DOCUMENTS\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            مدارک و اطلاعات مورد نیاز\n        </h2>\n<p>\n            مدارک مورد نیاز بر اساس نوع گواهی مشخص می‌شود.\n        </p>\n</div>\n<div class=\"mtc-documents\">\n<div class=\"mtc-document-box\">\n<strong>اشخاص حقیقی:</strong>\n            معمولاً اطلاعات هویتی و اطلاعات تماس متقاضی برای شروع\n            فرآیند مورد نیاز خواهد بود.\n\n        </div>\n<div class=\"mtc-document-box\">\n<strong>گواهی‌های وابسته:</strong>\n            ممکن است اطلاعات مربوط به شرکت، سازمان، سمت یا رابطه\n            متقاضی نیز مورد نیاز باشد.\n\n        </div>\n<div class=\"mtc-document-box\">\n<strong>نکته مهم:</strong>\n            پیش از شروع فرآیند، نوع گواهی و مدارک مورد نیاز بررسی\n            می‌شود تا از ثبت درخواست اشتباه جلوگیری شود.\n\n        </div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     FAQ\n========================= -->\n<section class=\"mtc-section section site-section\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            سوالات متداول درباره صدور گواهی امضای دیجیتال\n        </h2>\n</div>\n<div class=\"mtc-faq\">\n<details>\n<summary>\n                گواهی امضای دیجیتال چیست؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                گواهی امضای دیجیتال یک گواهی الکترونیکی برای\n                شناسایی صاحب گواهی و استفاده از امضای دیجیتال\n                در فرآیندهای الکترونیکی است.\n            </div>\n</details>\n<details>\n<summary>\n                چگونه گواهی امضای دیجیتال دریافت کنیم؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                ابتدا باید نوع گواهی موردنیاز مشخص و درخواست ثبت شود.\n                سپس مراحل بررسی اطلاعات، احراز هویت و صدور گواهی\n                انجام خواهد شد.\n            </div>\n</details>\n<details>\n<summary>\n                احراز هویت گواهی امضای دیجیتال چگونه انجام می‌شود؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                روش احراز هویت به نوع گواهی و فرآیند مرکز صادرکننده\n                بستگی دارد. پس از ثبت درخواست، مراحل لازم برای\n                احراز هویت به متقاضی اعلام می‌شود.\n            </div>\n</details>\n<details>\n<summary>\n                صدور گواهی امضای دیجیتال چقدر زمان می‌برد؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                زمان صدور به نوع گواهی، تکمیل بودن اطلاعات،\n                موفقیت احراز هویت و فرآیند مرکز صادرکننده بستگی دارد.\n            </div>\n</details>\n<details>\n<summary>\n                آیا برای گواهی امضای دیجیتال به توکن نیاز است؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                در برخی کاربردها استفاده از توکن سخت‌افزاری مورد نیاز\n                است و در برخی فرآیندها روش دیگری برای نگهداری گواهی\n                استفاده می‌شود. قبل از اقدام باید نیاز سامانه مقصد بررسی شود.\n            </div>\n</details>\n<details>\n<summary>\n                آیا می‌توان گواهی امضای دیجیتال را تمدید کرد؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                بله. برای گواهی‌هایی که قابلیت تمدید دارند،\n                فرآیند تمدید پیش از پایان اعتبار قابل انجام است.\n            </div>\n</details>\n<details>\n<summary>\n                آیا گواهی امضای دیجیتال برای سامانه مودیان قابل استفاده است؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                نوع گواهی و روش استفاده باید مطابق الزامات سامانه\n                و کاربرد موردنظر انتخاب شود. در صورت نیاز می‌توانید\n                برای انتخاب روش مناسب با کارشناسان ما مشورت کنید.\n            </div>\n</details>\n<details>\n<summary>\n                آیا می‌توان گواهی امضای دیجیتال را روی توکن K3 استفاده کرد؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                در صورت سازگاری نوع گواهی و فرآیند صدور با توکن\n                سخت‌افزاری، گواهی می‌تواند برای استفاده روی توکن K3\n                راه‌اندازی شود.\n            </div>\n</details>\n<details>\n<summary>\n                اگر در انتخاب نوع گواهی مطمئن نباشم چه کار کنم؟\n            </summary>\n<div class=\"mtc-faq-answer\">\n                قبل از ثبت درخواست با کارشناسان ما تماس بگیرید تا\n                بر اساس سامانه و کاربرد موردنظر، نوع گواهی مناسب\n                مشخص شود.\n            </div>\n</details>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     CTA\n========================= -->\n<section class=\"mtc-cta\">\n<div>\n<h2>\n            آماده دریافت گواهی امضای دیجیتال هستید؟\n        </h2>\n<p>\n            فرآیند دریافت گواهی را شروع کنید یا قبل از ثبت درخواست\n            برای انتخاب نوع گواهی مشاوره بگیرید.\n        </p>\n</div>\n<div class=\"mtc-cta-buttons\">\n<a class=\"mtc-cta-primary\" href=\"/services/\">\n            درخواست صدور گواهی\n        </a>\n<a class=\"mtc-cta-secondary\" href=\"#consultation\">\n            مشاوره تخصصی\n        </a>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     RELATED\n========================= -->\n<section class=\"mtc-related\">\n<div class=\"mtc-section-head section-head site-section-head\">\n<h2>\n            خدمات مرتبط\n        </h2>\n</div>\n<div class=\"mtc-related-grid\">\n<a class=\"mtc-related-card\" href=\"/guide/certificate/\">\n<h3>\n                تمدید گواهی امضای دیجیتال\n            </h3>\n<p>\n                تمدید گواهی پیش از پایان اعتبار و ادامه استفاده\n                از خدمات الکترونیکی.\n            </p>\n</a>\n<a class=\"mtc-related-card\" href=\"/services/vip/\">\n<h3>\n                خدمات VIP امضای دیجیتال\n            </h3>\n<p>\n                همراهی تخصصی برای افرادی که سرعت و سهولت انجام\n                فرآیند برایشان اهمیت دارد.\n            </p>\n</a>\n<a class=\"mtc-related-card\" href=\"/guide/csr/\">\n<h3>\n                تولید CSR\n            </h3>\n<p>\n                راهنمایی و خدمات تخصصی تولید CSR برای فرآیندهای\n                مورد نیاز گواهی دیجیتال.\n            </p>\n</a>\n<a class=\"mtc-related-card\" href=\"/product/توکن-mtoken-k3/\">\n<h3>\n                خرید توکن K3\n            </h3>\n<p>\n                تهیه توکن سخت‌افزاری K3 برای نگهداری و استفاده\n                از گواهی امضای دیجیتال.\n            </p>\n</a>\n</div>\n</section>\n</div>\n</div>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     FAQ SCHEMA\n========================= -->\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     BREADCRUMB SCHEMA\n========================= -->\n</div>\n<!-- /wp:html -->\n","support-home":"<!-- wp:html -->\n<div class=\"mtoken-gutenberg-page mtoken-page-support-home\">\n<header class=\"header\">\n<div class=\"container header-inner site-container\">\n<div class=\"logo\">M<span>token</span> Support</div>\n<ul class=\"nav\">\n<li><a href=\"#\">خانه</a></li><li><a href=\"#\">خدمات</a></li><li><a href=\"#\">سامانه‌ها</a></li>\n<li><a href=\"#\">توکن K3</a></li><li><a href=\"#\">راهنما</a></li><li><a href=\"#\">دانلودها</a></li><li><a href=\"#\">پایگاه دانش</a></li><li><a href=\"#\">تماس</a></li>\n</ul>\n<a class=\"btn btn-red site-btn site-btn--pri کنید و در صورت نیاز، از همراهی کارشناسان ما استفاده کنید.</p>\n<div class=\"cards\">\n<article class=\"card site-card\"><div class=\"icon\">✓</div><h3>صدور گواهی دیجیتال</h3><p>ثبت درخواست، احراز هویت و صدور گواهی امضای دیجیتال.</p><a class=\"link\" href=\"#\">مشاهده خدمت ←</a></article>\n<article class=\"card site-card\"><div class=\"icon\">↻</div><h3>تمدید گواهی دیجیتال</h3><p>تمدید گواهی و آماده‌سازی برای استفاده بدون وقفه.</p><a class=\"link\" href=\"#\">مشاهده خدمت ←</a></article>\n<article class=\"card site-card\"><div class=\"icon\">CSR</div><h3>تولید CSR</h3><p>تولید و آماده‌سازی CSR برای گواهی‌های موردنیاز سامانه‌ها.</p><a class=\"link\" href=\"#\">مشاهده خدمت ←</a></article>\n<article class=\"card site-card\"><div class=\"icon\">⚙</div><h3>خدمات تخصصی</h3><p>راه‌اندازی توکن، نصب نرم‌افزارها و تنظیمات موردنیاز.</p><a class=\"link\" href=\"#\">مشاهده خدمت ←</a></article>\n<article class=\"card site-card\"><div class=\"icon\">★</div><h3>خدمات VIP</h3><p>همراهی ویژه برای انجام ساده‌تر و سریع‌تر مراحل.</p><a class=\"link\" href=\"#vip\">مشاهده خدمت ←</a></article>\n<article class=\"card site-card\"><div class=\"icon\">K3</div><h3>خرید توکن K3</h3><p>تهیه توکن اصلی K3 همراه با خدمات نصب و راه‌اندازی.</p><a class=\"link\" href=\"#k3\">مشاهده و خرید ←</a></article>\n</div>\n</div>\n</section>\n<section class=\"section alt site-section\">\n<div class=\"container site-container\">\n<h2 class=\"title\">خدمات امضای دیجیتال برای سامانه‌های مختلف</h2>\n<p class=\"subtitle\">راهنمایی، راه‌اندازی و خدمات تخصصی موردنیاز برای استفاده از امضای دیجیتال.</p>\n<div class=\"systems\">\n<div class=\"system\">مودیان<small>امور مالیاتی</small></div>\n<div class=\"system\">جامع تجارت<small>ثبت سفارش و تجارت</small></div>\n<div class=\"system\">ستاد ایران<small>تدارکات الکترونیکی دولت</small></div>\n<div class=\"system\">کاتب<small>خدمات ثبتی</small></div>\n<div class=\"system\">ثبت من<small>خدمات ثبتی</small></div>\n<div class=\"system\">راهداری<small>حمل‌ونقل جاده‌ای</small></div>\n<div class=\"system\">بانک ملت<small>خدمات بانکی</small></div>\n<div class=\"system\">سایر سامانه‌ها<small>خدمات مبتنی بر گواهی</small></div>\n</div>\n</div>\n</section>\n<section class=\"section site-section\" id=\"vip\">\n<div class=\"container site-container\">\n<div class=\"vip\">\n<div>\n<h2>خدمات VIP امضای دیجیتال</h2>\n<p>برای زمانی که سرعت، دقت و همراهی تخصصی برای شما اهمیت دارد.</p>\n<ul><li>صدور و تمدید گواهی</li><li>راه‌اندازی و تنظیمات</li><li>خدمات سامانه‌ها</li><li>پشتیبانی اختصاصی</li></ul>\n</div>\n<a class=\"btn btn-red site-btn site-btn--primary\" href=\"tel:09128698052\">📞 تماس و خدمات VIP: ۰۹۱۲۸۶۹۸۰۵۲</a>\n</div>\n</div>\n</section>\n<section class=\"section alt site-section\" id=\"k3\">\n<div class=\"container k3 site-container\">\n<div>\n<h2 class=\"title\" style=\"text-align:right\">توکن K3؛ انتخابی مطمئن برای امضای دیجیتال</h2>\n<p style=\"color:#687386;font-size:14px;margin:12px 0 20px\">توکن Mtoken K3 برای استفاده در سامانه‌های مختلف مبتنی بر امضای دیجیتال ارائه می‌شود و در کنار آن، خدمات نصب، راه‌اندازی و پشتیبانی تخصصی نیز در دسترس است.</p>\n<a class=\"btn btn-red site-btn site-btn--primary\" href=\"#\">مشاهده و خرید توکن K3</a>\n<a class=\"btn btn-outline site-btn site-btn--outline\" href=\"#\" style=\"margin-right:8px\">راهنمای راه‌اندازی</a>\n</div>\n<div class=\"k3-box\"><div class=\"k3-mini\"></div><strong style=\"color:#0b1f3a\">Mtoken K3</strong><p>توکن سخت‌افزاری امضای دیجیتال</p></div>\n</div>\n</section>\n<section class=\"section site-section\">\n<div class=\"container site-container\">\n<h2 class=\"title\">دریافت خدمات چگونه انجام می‌شود؟</h2>\n<p class=\"subtitle\">فرآیند را ساده کرده‌ایم تا از ثبت درخواست تا راه‌اندازی، مسیر مشخصی داشته باشید.</p>\n<div class=\"steps\">\n<div class=\"step\"><div class=\"num\">۱</div><h3>ثبت درخواست</h3><p>خدمت موردنیاز خود را انتخاب کنید.</p></div>\n<div class=\"step\"><div class=\"num\">۲</div><h3>بررسی درخواست</h3><p>کارشناس شرایط و نیاز شما را بررسی می‌کند.</p></div>\n<div class=\"step\"> e-card guide-red\" href=\"#\">\n<div class=\"guide-icon\">\n<span>⌘</span>\n</div>\n<div class=\"guide-content\">\n<span class=\"guide-number\">01</span>\n<h3>راهنمای نصب و راه‌اندازی توکن</h3>\n<p>\n            آموزش نصب درایور و نرم‌افزار توکن امضای دیجیتال،\n            اتصال توکن به سیستم و آماده‌سازی آن برای استفاده.\n          </p>\n<span class=\"guide-link\">\n            مشاهده راهنمای نصب\n            <b>←</b>\n</span>\n</div>\n</a>\n<!-- Card 2 -->\n<a class=\"mtoken-guide-card guide-blue\" href=\"#\">\n<div class=\"guide-icon\">\n<span>▣</span>\n</div>\n<div class=\"guide-content\">\n<span class=\"guide-number\">02</span>\n<h3>راهنمای گواهی امضای دیجیتال</h3>\n<p>\n            آموزش مدیریت گواهی دیجیتال، بررسی گواهی‌های موجود روی توکن،\n            تمدید و استفاده صحیح از گواهی امضای الکترونیکی.\n          </p>\n<span class=\"guide-link\">\n            مشاهده راهنمای گواهی\n            <b>←</b>\n</span>\n</div>\n</a>\n<!-- Card 3 -->\n<a class=\"mtoken-guide-card guide-navy\" href=\"#\">\n<div class=\"guide-icon\">\n<span>◎</span>\n</div>\n<div class=\"guide-content\">\n<span class=\"guide-number\">03</span>\n<h3>آموزش امضای دیجیتال در سامانه‌ها</h3>\n<p>\n            راهنمای استفاده از توکن و گواهی امضای دیجیتال\n            در سامانه‌های مختلف و آموزش مراحل انجام امضای الکترونیکی.\n          </p>\n<span class=\"guide-link\">\n            مشاهده آموزش سامانه‌ها\n            <b>←</b>\n</span>\n</div>\n</a>\n<!-- Card 4 -->\n<a class=\"mtoken-guide-card guide-dark\" href=\"#\">\n<div class=\"guide-icon\">\n<span>?</span>\n</div>\n<div class=\"guide-content\">\n<span class=\"guide-number\">04</span>\n<h3>رفع خطا و مشکلات متداول</h3>\n<p>\n            راهکارهای سریع برای مشکلاتی مانند شناسایی نشدن توکن،\n            خطای PIN، نصب نبودن CSP و خطاهای هنگام امضای دیجیتال.\n          </p>\n<span class=\"guide-link\">\n            مشاهده راهکارها\n            <b>←</b>\n</span>\n</div>\n</a>\n</div>\n<div class=\"mtoken-guides-footer\">\n<span>\n        راهنمای اس
