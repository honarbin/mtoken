const pages = {"services":"<!-- wp:html -->\n<div class=\"mtoken-gutenberg-page mtoken-page-services\">\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     HERO\n========================= -->\n<header class=\"hero\">\n<div class=\"container hero-grid site-container\">\n<div class=\"hero-content\">\n<div class=\"eyebrow site-label\">\n                خدمات تخصصی راه‌اندازی گواهی دیجیتال\n            </div>\n<h1>\n                گواهی دیجیتال شما،\n                <span>آماده استفاده</span>\n</h1>\n<p class=\"hero-text\">\n                برای استفاده از گواهی دیجیتال در سامانه‌های مختلف،\n                بسته به نوع سامانه ممکن است به توکن، Java، دستینه،\n                Middleware، نرم‌افزارهای جانبی یا تنظیمات خاص نیاز باشد.\n                شما فقط سامانه‌ای را که می‌خواهید با آن کار کنید معرفی کنید؛\n                ما مسیر فنی موردنیاز برای راه‌اندازی را مشخص و آماده می‌کنیم.\n            </p>\n<div class=\"hero-actions\">\n<a class=\"btn btn-primary site-btn site-btn--primary\" href=\"tel:09128698052\">\n                    📞 راهنمایی و راه‌اندازی: ۰۹۱۲۸۶۹۸۰۵۲\n                </a>\n<a class=\"btn btn-outline site-btn site-btn--outline\" href=\"#systems\">\n                    مشاهده سامانه‌ها\n                    ←\n                </a>\n</div>\n<div class=\"hero-note\">\n<span class=\"hero-note-icon\">✓</span>\n                لازم نیست نام نرم‌افزار یا تنظیمات موردنیاز سامانه را بدانید.\n            </div>\n</div>\n<div class=\"token-wrapper\">\n<div class=\"token-glow\"></div>\n<div class=\"token\">\n<div class=\"token-brand\">\n                    DIGITAL CERTIFICATE\n                </div>\n<div class=\"token-light\"></div>\n</div>\n<figure class=\"mtoken-image-placeholder mtoken-image-services-hero\">\n<img alt=\"تصویر معرفی خدمات راه‌اندازی گواهی دیجیتال\" decoding=\"async\" height=\"850\" loading=\"eager\" src=\"assets/images/placeholders/services-hero.svg\" width=\"1200\"/>\n<figcaption>محل پیشنهادی تصویر: تصویر معرفی خدمات راه‌اندازی گواهی دیجیتال — 1200×850 پیکسل</figcaption>\n</figure></div>\n</div>\n</header>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     INTRO\n========================= -->\n<div class=\"intro-bar\">\n<div class=\"container intro-inner site-container\">\n<div class=\"intro-title\">\n            سامانه را بگویید؛\n            <span>راه‌اندازی را به ما بسپارید.</span>\n</div>\n<div class=\"intro-text\">\n            دستینه، Java یا هر مسیر فنی دیگری، متناسب با سامانه شما بررسی می‌شود.\n        </div>\n</div>\n</div>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     TECH PATHS\n========================= -->\n<section class=\"paths\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n                مسیر راه‌اندازی\n            </div>\n<h2>\n                هر سامانه، مسیر فنی خودش را دارد\n            </h2>\n<p>\n                استفاده از گواهی دیجیتال در همه سامانه‌ها به یک روش انجام نمی‌شود.\n                ما ابتدا سامانه را مشخص می‌کنیم و سپس ابزار و تنظیمات مناسب همان سامانه را آماده می‌کنیم.\n            </p>\n</div><figure class=\"mtoken-image-placeholder mtoken-image-services-process\">\n<img alt=\"نمای کلی مسیر راه‌اندازی گواهی دیجیتال\" decoding=\"async\" height=\"600\" loading=\"lazy\" src=\"assets/images/placeholders/services-process.svg\" width=\"1400\"/>\n<figcaption>محل پیشنهادی تصویر: نمای کلی مسیر راه‌اندازی گواهی دیجیتال — 1400×600 پیکسل</figcaption>\n</figure>\n<div class=\"paths-grid\">\n<div class=\"path-card\">\n<div class=\"path-icon\">\n                    🔐\n                </div>\n<h3>\n                    سامانه‌های مبتنی بر دستینه\n                </h3>\n<p>\n                    در سامانه‌هایی که برای استفاده از گواهی به سرویس یا نرم‌افزار\n                    دستینه نیاز دارند، نصب، راه‌اندازی و تنظیمات موردنیاز انجام می‌شود.\n                </p>\n</div>\n<div class=\"path-card\">\n<div class=\"path-icon\">\n                    ☕\n                </div>\n<h3>\n                    سامانه‌های مبتنی بر Java\n                </h3>\n<p>\n                    برخی سامانه‌ها برای اجرای بخش امضای دیجیتال یا دسترسی به گواهی\n                    از Java استفاده می‌کنند. نسخه مناسب Java و تنظیمات موردنیاز بررسی و آماده می‌شود.\n                </p>\n</div>\n<div class=\"path-card\">\n<div class=\"path-icon\">\n                    ⚙\n                </div>\n<h3>\n                    سایر روش‌های استفاده از گواهی\n                </h3>\n<p>\n                    در بعضی سامانه‌ها ممکن است Middleware، نرم‌افزار اختصاصی،\n                    تنظیمات مرورگر یا روش فنی دیگری موردنیاز باشد.\n                </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     SYSTEMS\n========================= -->\n<section class=\"systems\" id=\"systems\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n                سامانه‌های قابل پشتیبانی\n            </div>\n<h2>\n                با کدام سامانه کار می‌کنید؟\n            </h2>\n<p>\n                نام سامانه را به ما بگویید؛\n                کارشناسان بر اساس همان سامانه، مسیر مناسب استفاده از گواهی دیجیتال را بررسی می‌کنند.\n            </p>\n</div>\n<div class=\"systems-grid\">\n<!-- Moadian -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">01</span>\n<div class=\"system-icon\">\n                    🧾\n                </div>\n<h3>\n                    سامانه مودیان\n                </h3>\n<p>\n                    آماده‌سازی محیط موردنیاز برای استفاده از گواهی دیجیتال\n                    در فرآیندهای مرتبط با سامانه مودیان و تنظیمات لازم برای امضای الکترونیکی.\n                </p>\n<span class=\"system-tag\">\n                    امور مالیاتی\n                </span>\n</div>\n<!-- Comprehensive Trade -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">02</span>\n<div class=\"system-icon\">\n                    🌐\n                </div>\n<h3>\n                    سامانه جامع تجارت\n                </h3>\n<p>\n                    آماده‌سازی توکن و محیط نرم‌افزاری موردنیاز برای استفاده\n                    از گواهی دیجیتال در فرآیندهای سامانه جامع تجارت.\n                </p>\n<span class=\"system-tag\">\n                    تجارت و ثبت سفارش\n                </span>\n</div>\n<!-- SETAD -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">03</span>\n<div class=\"system-icon\">\n                    🏛\n                </div>\n<h3>\n                    سامانه ستاد ایران\n                </h3>\n<p>\n                    آماده‌سازی محیط اجرای موردنیاز سامانه، از جمله بررسی\n                    نسخه و تنظیمات Java در مواردی که اجرای سامانه به Java وابسته است.\n                </p>\n<span class=\"system-tag\">\n                    Java\n                </span>\n</div>\n<!-- Kateb -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">04</span>\n<div class=\"system-icon\">\n                    📑\n                </div>\n<h3>\n                    سامانه کاتب\n                </h3>\n<p>\n                    آماده‌سازی محیط استفاده از گواهی دیجیتال و بررسی\n                    نرم‌افزارها و تنظیمات لازم متناسب با فرآیند سامانه کاتب.\n                </p>\n<span class=\"system-tag\">\n                    خدمات ثبتی\n                </span>\n</div>\n<!-- Sabt Man -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">05</span>\n<div class=\"system-icon\">\n                    🗂\n                </div>\n<h3>\n                    سامانه ثبت من\n                </h3>\n<p>\n                    تنظیم و آماده‌سازی محیط لازم برای استفاده از گواهی دیجیتال\n                    در خدمات الکترونیکی و فرآیندهای مرتبط با سامانه ثبت من.\n                </p>\n<span class=\"system-tag\">\n                    خدمات ثبتی\n                </span>\n</div>\n<!-- Rahdari -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">06</span>\n<div class=\"system-icon\">\n                    🚚\n                </div>\n<h3>\n                    سامانه راهداری\n                </h3>\n<p>\n                    بررسی محیط نرم‌افزاری و آماده‌سازی توکن و گواهی دیجیتال\n                    برای استفاده در سامانه‌های مرتبط با خدمات حمل‌ونقل جاده‌ای.\n                </p>\n<span class=\"system-tag\">\n                    حمل‌ونقل\n                </span>\n</div>\n<!-- Mellat -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">07</span>\n<div class=\"system-icon\">\n                    🏦\n                </div>\n<h3>\n                    سامانه‌های بانک ملت\n                </h3>\n<p>\n                    آماده‌سازی محیط لازم برای استفاده از گواهی دیجیتال؛\n                    در مسیرهای مبتنی بر Java، نسخه و تنظیمات Java و اجرای صحیح محیط بررسی می‌شود.\n                </p>\n<span class=\"system-tag\">\n                    Java\n                </span>\n</div>\n<!-- Other -->\n<div class=\"system-card site-card\">\n<span class=\"system-number\">08</span>\n<div class=\"system-icon\">\n                    ✦\n                </div>\n<h3>\n                    سایر سامانه‌ها\n                </h3>\n<p>\n                    سامانه موردنظر شما در لیست نیست؟\n                    نام سامانه و نوع توکن خود را اعلام کنید تا مسیر مناسب راه‌اندازی بررسی شود.\n                </p>\n<span class=\"system-tag\">\n                    بررسی تخصصی\n                </span>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     MAIN SERVICE\n========================= -->\n<section class=\"service\">\n<div class=\"container site-container\">\n<div class=\"service-box\">\n<div class=\"service-content\">\n<div class=\"section-label site-label site-section-label\">\n                    خدمات تخصصی\n                </div>\n<h2>\n                    سامانه را بگویید >01</i>\n                        شناسایی روش استفاده از گواهی\n                    </div>\n<div class=\"visual-item\">\n<i>02</i>\n                        بررسی نرم‌افزار و محیط اجرا\n                    </div>\n<div class=\"visual-item\">\n<i>03</i>\n                        نصب و تنظیم ابزار موردنیاز\n                    </div>\n<div class=\"visual-item\">\n<i>04</i>\n                        آماده‌سازی برای استفاده\n                    </div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     TECHNOLOGY\n========================= -->\n<section class=\"technology\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n                راهکارهای فنی\n            </div>\n<h2>\n                ابزار موردنیاز را سامانه مشخص می‌کند\n            </h2>\n<p>\n                دستینه، Java و Middleware جایگزین یکدیگر نیستند.\n                هر سامانه ممکن است از یکی از این روش‌ها یا ترکیبی از ابزارها استفاده کند.\n            </p>\n</div>\n<div class=\"tech-grid\">\n<div class=\"tech-card\">\n<div class=\"tech-code\">\n                    DASTINEH\n                </div>\n<h3>\n                    دستینه\n                </h3>\n<p>\n                    در سامانه‌هایی که دستینه برای دسترسی یا استفاده از گواهی\n                    موردنیاز است، سرویس و تنظیمات مربوط به آن آماده می‌شود.\n                </p>\n</div>\n<div class=\"tech-card\">\n<div class=\"tech-code\">\n                    JAVA\n                </div>\n<h3>\n                    Java\n                </h3>\n<p>\n                    در سامانه‌های مبتنی بر Java، نسخه مناسب و تنظیمات اجرای\n                    برنامه بررسی می‌شود تا محیط موردنیاز سامانه آماده باشد.\n                </p>\n</div>\n<div class=\"tech-card\">\n<div class=\"tech-code\">\n                    MIDDLEWARE\n                </div>\n<h3>\n                    Middleware\n                </h3>\n<p>\n                    بسته به نوع توکن و سامانه، ممکن است Middleware مناسب\n                    برای دسترسی نرم‌افزار به گواهی نیاز باشد.\n                </p>\n</div>\n<div class=\"tech-card\">\n<div class=\"tech-code\">\n                    SETTINGS\n                </div>\n<h3>\n                    تنظیمات محیط\n                </h3>\n<p>\n                    تنظیمات مرورگر، نرم‌افزار، دسترسی‌ها و سایر اجزای\n                    موردنیاز سامانه نیز در فرآیند راه‌اندازی بررسی می‌شوند.\n                </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     PROCESS\n========================= -->\n<section class=\"process\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n                فرآیند دریافت خدمت\n            </div>\n<h2>\n                راه‌اندازی بدون سردرگمی\n            </h2>\n<p>\n                قرار نیست خودتان از روی خطاها حدس بزنید چه نرم‌افزاری لازم است.\n            </p>\n</div>\n<div class=\"process-grid\">\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                    ۱\n                </div>\n<h3>\n                    سامانه را اعلام کنید\n                </h3>\n<p>\n                    فقط نام سامانه‌ای که می‌خواهید با آن کار کنید را بگویید.\n                </p>\n</div>\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                    ۲\n                </div>\n<h3>\n                    نوع توکن را بررسی می‌کنیم\n                </h3>\n<p>\n                    نوع توکن و روش دسترسی به گواهی بررسی می‌شود.\n                </p>\n</div>\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                    ۳\n                </div>\n<h3>\n                    محیط را آماده می‌کنیم\n                </h3>\n<p>\n                    Java، دستینه، Middleware یا تنظیمات لازم آماده می‌شود.\n                </p>\n</div>\n<div class=\"process-card site-card\">\n<div class=\"process-number\">\n                    ۴\n                </div>\n<h3>\n                    آماده استفاده\n                </h3>\n<p>\n                    محیط برای استفاده از گواهی دیجیتال در سامانه آماده می‌شود.\n                </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     SEARCH / SEO\n========================= -->\n<section class=\"search-section\">\n<div class=\"container site-container\">\n<div class=\"search-box\">\n<h2>\n                اگر با یکی از این عبارت‌ها جستجو کرده‌اید...\n            </h2>\n<p>\n                لازم نیست دنبال راه‌حل فنی بگردید و چند نرم‌افزار مختلف را امتحان کنید.\n                می‌توانید راه‌اندازی محیط استفاده از گواهی دیجیتال را به کارشناس بسپارید.\n            </p>\n<div class=\"search-tags\">\n<span class=\"search-tag\">\n                    راه‌اندازی دستینه\n                </span>\n<span class=\"search-tag\">\n                    نصب دستینه\n                </span>\n<span class=\"search-tag\">\n                    تنظیم دستینه\n                </span>\n<span class=\"search-tag\">\n                    خطای Java سامانه ستاد\n                </span>\n<span class=\"search-tag\">\n                    Unable to Launch Application\n                </span>\n<span class=\"search-tag\">\n                    نصب Java سامانه ستاد\n                </span>\n<span class=\"search-tag\">\n                    Java بانک ملت\n                </span>\n<span class=\"search-tag\">\n                    راه‌اندازی توکن\n                </span>\n<span class=\"search-tag\">\n                    شناسایی توکن گواهی\n                </span>\n<span class=\"search-tag\">\n                    استفاده از گواهی دیجیتال\n                </span>\n<span class=\"search-tag\">\n                    گواهی دیجیتال مودیان\n                </span>\n<span class=\"search-tag\">\n                    توکن سامانه مودیان\n                </span>\n<span class=\"search-tag\">\n                    گواهی دیجیتال کاتب\n                </span>\n<span class=\"search-tag\">\n                    گواهی دیجیتال ثبت من\n                </span>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     WHY US\n========================= -->\n<section class=\"why\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n                چرا این خدمت؟\n            </div>\n<h2>\n                شما درگیر جزئیات فنی نمی‌شوید\n            </h2>\n<p>\n                هدف این خدمت این است که مسیر فنی را متناسب با سامانه شما مشخص کنیم\n                و محیط موردنیاز را برای استفاده آماده کنیم.\n            </p>\n</div>\n<div class=\"why-grid\">\n<div class=\"why-card site-card\">\n<div class=\"why-icon\">\n                    ✓\n                </div>\n<h3>\n                    تشخیص مسیر مناسب\n                </h3>\n<p>\n                    لازم نیست بدانید سامانه شما به دستینه، Java، Middleware\n                    یا ابزار دیگری نیاز دارد؛ این موضوع بر اساس سامانه بررسی می‌شود.\n                </p>\n</div>\n<div class=\"why-card site-card\">\n<div class=\"why-icon\">\n                    ⚙\n                </div>\n<h3>\n                    آماده‌سازی تخصصی\n                </h3>\n<p>\n                    نصب نرم‌افزارها و تنظیمات لازم متناسب با محیط و روش استفاده\n                    از گواهی انجام می‌شود.\n                </p>\n</div>\n<div class=\"why-card site-card\">\n<div class=\"why-icon\">\n                    ☎\n                </div>\n<h3>\n                    پشتیبانی انسانی\n                </h3>\n<p>\n                    به جای اینکه بین آموزش‌ها و راهکارهای مختلف جستجو کنید،\n                    موضوع را با کارشناس مطرح می‌کنید و مسیر مناسب را دریافت می‌کنید.\n                </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     SECURITY\n========================= -->\n<section class=\"security\">\n<div class=\"container site-container\">\n<div class=\"security-box\">\n<div class=\"security-icon\">\n                🔒\n            </div>\n<div>\n<h3>\n                    امنیت گواهی و کلید خصوصی\n                </h3>\n<p>\n                    کلید خصوصی گواهی دیجیتال اطلاعات حساسی است و باید نزد دارنده گواهی باقی بماند.\n                    در فرآیند راه‌اندازی، هدف آماده‌سازی محیط و ابزارهای لازم برای استفاده از گواهی است\n                    و نباید اطلاعات محرمانه گواهی بدون ضرورت در اختیار دیگران قرار گیرد.\n                </p>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     FAQ\n========================= -->\n<section class=\"faq\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n                پرسش‌های متداول\n            </div>\n<h2>\n                قبل از درخواست راه‌اندازی\n            </h2>\n</div>\n<div class=\"faq-list\">\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    من نمی‌دانم سامانه از دستینه استفاده می‌کند یا Java؛ چه کار کنم؟\n                </summary>\n<div class=\"faq-answer\">\n                    نیازی نیست خودتان روش فنی سامانه را تشخیص دهید.\n                    کافی است نام سامانه را اعلام کنید تا مسیر موردنیاز برای استفاده\n                    از گواهی بررسی شود و بر اساس آن راه‌اندازی انجام شود.\n                </div>\n</details>\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    آیا همه سامانه‌ها به دستینه نیاز دارند؟\n                </summary>\n<div class=\"faq-answer\">\n                    خیر. دستینه تنها یکی از روش‌های استفاده از گواهی دیجیتال است.\n                    بعضی سامانه‌ها از Java استفاده می‌کنند و برخی دیگر ممکن است\n                    به Middleware یا نرم‌افزار و تنظیمات اختصاصی نیاز داشته باشند.\n                </div>\n</details>\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    برای سامانه ستاد اگر Unable to Launch Application نمایش داده شود، چه کاری لازم است؟\n                </summary>\n<div class=\"faq-answer\">\n                    در سامانه‌هایی که اجرای بخشی از فرآیند به Java وابسته است،\n                    نسخه Java و تنظیمات محیط اجرا می‌تواند اهمیت داشته باشد.\n                    در این شرایط محیط Java و تنظیمات لازم متناسب با سامانه بررسی می‌شود.\n                </div>\n</details>\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    برای بانک ملت هم می‌توانید محیط Java را آماده کنید؟\n                </summary>\n<div class=\"faq-answer\">\n                    در مواردی که فرآیند موردنظر از Java استفاده می‌کند،\n                    نسخه و تنظیمات محیط Java بررسی و برای اجرای صحیح سامانه آماده می‌شود.\n                </div>\n</details>\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    اگر سامانه من در لیست شما نیست چه کنم؟\n                </summary>\n<div class=\"faq-answer\">\n                    کافی است نام سامانه و در صورت امکان مدل یا نوع توکن خود را اعلام کنید.\n                    مسیر فنی موردنیاز بررسی می‌شود و در صورت امکان، راه‌اندازی آن انجام خواهد شد.\n                </div>\n</details>\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    آیا باید خودم نرم‌افزارها را دانلود و نصب کنم؟\n                </summary>\n<div class=\"faq-answer\">\n                    اگر برای دریافت خدمت راه‌اندازی اقدام کنید، کارشناس بر اساس سامانه\n                    و روش موردنیاز، نرم‌افزارها و تنظیمات لازم را بررسی و آماده می‌کند.\n                </div>\n</details>\n<details class=\"faq-item site-faq-item\">\n<summary>\n                    آیا برای راه‌اندازی باید کلید خصوصی گواهی را ارسال کنم؟\n                </summary>\n<div class=\"faq-answer\">\n                    کلید خصوصی اطلاعات محرمانه‌ای است و نباید بدون ضرورت در اختیار دیگران قرار گیرد.\n                    در راه‌اندازی توکن، هدف آماده‌سازی محیط لازم برای استفاده از گواهی است.\n                </div>\n</details>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =========================\n     FINAL CTA\n========================= -->\n<section class=\"final-cta\">\n<div class=\"container site-container\">\n<h2>\n            فقط بگویید با کدام\n            <span>سامانه</span>\n            کار دارید\n        </h2>\n<p>\n            لازم نیست نام نرم‌افزار، نسخه Java یا روش دسترسی به گواهی را بدانید.\n            سامانه را معرفی کنید تا مسیر مناسب راه‌اندازی را با شما بررسی کنیم.\n        </p>\n<div class=\"final-actions\">\n<a class=\"btn btn-primary site-btn site-btn--primary\" href=\"tel:09128698052\">\n                📞 تماس با کارشناس: ۰۹۱۲۸۶۹۸۰۵۲\n            </a>\n<a class=\"btn btn-outline site-btn site-btn--outline\" href=\"/support/\">\n                پشتیبانی آنلاین\n            </a>\n</div>\n<div class=\"final-note\">\n            راه‌اندازی دستینه، Java، Middleware و محیط استفاده از گواهی دیجیتال\n            متناسب با سامانه\n        </div>\n</div>\n</section>\n</div>\n<!-- /wp:html -->\n","systems-guide":"<!-- wp:html -->\n<div class=\"mtoken-gutenberg-page mtoken-page-systems-guide\">\n<div class=\"mtoken-guide\">\n<div class=\"mg-container container site-container\">\n<!-- Breadcrumb -->\n<div class=\"mg-breadcrumb\">\n            صفحه اصلی\n            <span>←</span>\n            راهنما\n            <span>←</span>\n            آموزش امضای دیجیتال در سامانه‌ها\n        </div>\n<!-- HERO -->\n<section class=\"mg-hero\">\n<div class=\"mg-hero-content\">\n<div class=\"mg-label section-label site-label site-section-label\">\n<i></i>\n                    راهنمای کاربردی امضای دیجیتال\n                </div>\n<h1>\n                    آموزش <strong>امضای دیجیتال</strong> در سامانه‌ها\n                </h1>\n<p>\n                    راهنمای استفاده از گواهی و توکن امضای دیجیتال\n                    در سامانه‌های پرکاربرد از جمله ثبت من، سامانه جامع تجارت،\n                    سامانه مودیان و سامانه‌های مرتبط با ثبت شرکت‌ها.\n                </p>\n<div class=\"mg-hero-buttons\">\n<a class=\"mg-btn btn mg-btn-red btn-primary site-btn site-btn--primary\" href=\"#systems\">\n                        مشاهده راهنما\n                    </a>\n<a class=\"mg-btn btn mg-btn-light btn-outline site-btn site-btn--outline\" href=\"#errors\">\n                        رفع خطاهای امضا\n                    </a>\n</div>\n</div>\n</section>\n<!-- QUICK NAV -->\n<section class=\"mg-section section site-section\">\n<div class=\"mg-section-head section-head site-section-head\">\n<h2>راهنمای سریع سامانه‌ها</h2>\n<p>\n                    برای مشاهده مراحل مربوط به هر سامانه، گزینه موردنظر را انتخاب کنید.\n                </p>\n</div>\n<div class=\"mg-nav-grid\">\n<a class=\"mg-nav-card\" href=\"#sabteman\">\n<div class=\"mg-icon\">◈</div>\n<h3>سامانه ثبت من</h3>\n<p>\n                        آموزش استفاده از امضای دیجیتال در خدمات ثبتی\n                    </p>\n<span class=\"mg-arrow\">←</span>\n</a>\n<a class=\"mg-nav-card\" href=\"#ntsw\">\n<div class=\"mg-icon\">⌘</div>\n<h3>سامانه جامع تجارت</h3>\n<p>\n                        راهنمای امضای دیجیتال در فرآیندهای تجارت\n                    </p>\n<span class=\"mg-arrow\">←</span>\n</a>\n<a class=\"mg-nav-card\" href=\"#modian\">\n<div class=\"mg-icon\">▣</div>\n<h3>سامانه مودیان</h3>\n<p>\n                        آشنایی با پیش‌نیازها و فرآیند امضای دیجیتال\n                    </p>\n<span class=\"mg-arrow\">←</span>\n</a>\n<a class=\"mg-nav-card\" href=\"#companies\">\n<div class=\"mg-icon\">▤</div>\n<h3>ثبت شرکت‌ها</h3>\n<p>\n                        کاربرد گواهی امضای دیجیتال در امور ثبتی\n                    </p>\n<span class=\"mg-arrow\">←</span>\n</a>\n</div>\n</section>\n<!-- INTRO -->\n<section class=\"mg-section section site-section\">\n<div class=\"mg-section-head section-head site-section-head\">\n<h2>امضای دیجیتال چگونه در سامانه‌ها استفاده می‌شود؟</h2>\n</div><div class=\"mg-info\">\n<p>\n                    امضای دیجیتال برای تأیید هویت امضاکننده و ثبت الکترونیکی\n                    یک درخواست، سند یا عملیات استفاده می‌شود. در بسیاری از\n                    سامانه‌های سازمانی، کاربر پس از ورود به فرآیند موردنظر،\n                    باید گواهی امضای دیجیتال خود را انتخاب کرده و با استفاده\n                    از PIN توکن یا روش احراز هویت مربوط به گواهی، عملیات امضا\n                    را نهایی کند.\n                </p>\n<div class=\"mg-highlight\">\n<strong>نکته مهم:</strong>\n                    روش انجام امضا در هر سامانه ممکن است متفاوت باشد و با\n                    به‌روزرسانی سامانه‌ها، نام گزینه‌ها یا ظاهر صفحات تغییر کند.\n                    بنابراین در صورت تفاوت ظاهر سامانه با این راهنما،\n                    منطق کلی فرآیند را دنبال کنید.\n                </div>\n</div>\n</section>\n<!-- REQUIREMENTS -->\n<section class=\"mg-section section site-section\">\n<div class=\"mg-section-head section-head site-section-head\">\n<h2>پیش‌نیازهای استفاده از امضای دیجیتال</h2>\n<p>\n                    قبل از شروع، موارد زیر را بررسی کنید.\n                </p>\n</div>\n<div class=\"mg-four-grid\">\n<div class=\"mg-mini\">\n<span class=\"mg-number\">01</span>\n<h3>توکن امضای دیجیتال</h3>\n<p>\n                        توکن باید به رایانه متصل و توسط سیستم شناسایی شده باشد.\n                    </p>\n</div>\n<div class=\"mg-mini\">\n<span class=\"mg-number\">02</span>\n<h3>گواهی معتبر</h3>\n<p>\n                        گواهی امضای دیجیتال باید معتبر باشد و منقضی یا باطل نشده باشد.\n                    </p>\n</div>\n<div class=\"mg-mini\">\n<span class=\"mg-number\">03</span>\n<h3>درایور و نرم‌افزار</h3>\n<p>\n                        درایور توکن و نرم‌افزارهای موردنیاز سامانه باید نصب باشند.\n                    </p>\n</div>\n<div class=\"mg-mini\">\n<span class=\"mg-number\">04</span>\n<h3>PIN توکن</h3>\n<p>\n                        PIN صحیح توکن را در اختیار داشته باشید و آن را در اختیار دیگران قرار ندهید.\n                    </p>\n</div>\n</div>\n</section>\n<!-- SYSTEMS -->\n<section class=\"mg-section section site-section\" id=\"systems\">\n<div class=\"mg-section-head section-head site-section-head\">\n<h2>آموزش امضای دیجیتال در سامانه‌های پرکاربرد</h2>\n<p>\n                    مراحل کلی هر سامانه را در بخش مربوط به آن مشاهده کنید.\n                </p>\n</div>\n<!-- SABTEMAN -->\n<div class=\"mg-system\" id=\"sabteman\">\n<div class=\"mg-system-top\">\n<div class=\"mg-system-icon\">◈</div>\n<div>\n<h2>سامانه ثبت من</h2>\n<p>\n                            آموزش کلی استفاده از گواهی و توکن امضای دیجیتال\n                        </p>\n</div>\n</div>\n<div class=\"mg-system-body\">\n<div class=\"mg-steps\">\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۱</span>\n<h3>ورود به فرآیند</h3>\n<p>\n                                وارد خدمت موردنظر در سامانه ثبت من شوید و فرآیند\n                                مربوط به درخواست خود را آغاز کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۲</span>\n<h3>آماده‌سازی توکن</h3>\n<p>\n                                توکن امضای دیجیتال را متصل کرده و مطمئن شوید\n                                گواهی توسط سیستم قابل شناسایی است.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۳</span>\n<h3>انتخاب گواهی</h3>\n<p>\n                                در زمان درخواست امضا، گواهی صحیح خود را از\n                                فهرست گواهی‌های نمایش داده‌شده انتخاب کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۴</span>\n<h3>تأیید PIN</h3>\n<p>\n                                در صورت درخواست سامانه یا نرم‌افزار واسط،\n                                PIN توکن را وارد کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۵</span>\n<h3>ثبت امضا</h3>\n<p>\n                                پس از تأیید گواهی و رمز، عملیات امضا را تکمیل\n                                کرده و منتظر پیام موفقیت باشید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۶</span>\n<h3>بررسی نتیجه</h3>\n<p>\n                                وضعیت درخواست را بررسی کنید تا مطمئن شوید\n                                امضای دیجیتال با موفقیت ثبت شده است.\n                            </p>\n</div>\n</div>\n<div class=\"mg-checklist\">\n<div class=\"mg-check\">\n                            توکن توسط ویندوز شناسایی شده است\n                        </div>\n<div class=\"mg-check\">\n                            گواهی دیجیتال معتبر است\n                        </div>\n<div class=\"mg-check\">\n                            نرم‌افزار موردنیاز نصب است\n                        </div>\n<div class=\"mg-check\">\n                            گواهی صحیح انتخاب شده است\n                        </div>\n</div>\n</div>\n</div>\n<!-- NTSW -->\n<div class=\"mg-system\" id=\"ntsw\">\n<div class=\"mg-system-top\">\n<div class=\"mg-system-icon\">⌘</div>\n<div>\n<h2>سامانه جامع تجارت</h2>\n<p>\n                            راهنمای استفاده از امضای دیجیتال در فرآیندهای سامانه\n                        </p>\n</div>\n</div>\n<div class=\"mg-system-body\">\n<div class=\"mg-steps\">\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۱</span>\n<h3>ورود به حساب کاربری</h3>\n<p>\n                                وارد حساب کاربری خود در سامانه جامع تجارت شوید\n                                و فرآیند موردنظر را انتخاب کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۲</span>\n<h3>اتصال توکن</h3>\n<p>\n                                توکن را به رایانه متصل کنید و از شناسایی صحیح\n                                آن توسط سیستم مطمئن شوید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۳</span>\n<h3>اجرای فرآیند امضا</h3>\n<p>\n                                در مرحله‌ای که سامانه درخواست امضا می‌کند،\n                                گزینه امضای دیجیتال را انتخاب کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۴</span>\n<h3>انتخاب Certificate</h3>\n<p>\n                                گواهی موردنظر را از فهرست گواهی‌های موجود\n                                انتخاب کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۵</span>\n<h3>وارد کردن PIN</h3>\n<p>\n                                در صورت درخواست، PIN توکن را وارد کرده و\n                                عملیات امضا را تأیید کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۶</span>\n<h3>بررسی پیام موفقیت</h3>\n<p>\n                                پس از پایان عملیات، نتیجه ثبت امضا را در\n                                همان فرآیند بررسی کنید.\n                            </p>\n</div>\n</div>\n<div class=\"mg-alert\">\n                        اگر سامانه گواهی را نمایش نمی‌دهد، ابتدا اتصال توکن،\n                        نصب بودن درایور و شناسایی گواهی در سیستم را بررسی کنید.\n                    </div>\n</div>\n</div>\n<!-- MODIAN -->\n<div class=\"mg-system\" id=\"modian\">\n<div class=\"mg-system-top\">\n<div class=\"mg-system-icon\">▣</div>\n<div>\n<h2>سامانه مودیان</h2>\n<p>\n                            پیش‌نیازها و مراحل کلی استفاده از امضای دیجیتال\n                        </p>\n</div>\n</div>\n<div class=\"mg-system-body\">\n<div class=\"mg-steps\">\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۱</span>\n<h3>آماده‌سازی گواهی</h3>\n<p>\n                                اطمینان حاصل کنید گواهی مورد استفاده معتبر\n                                و قابل استفاده است.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۲</span>\n<h3>بررسی نرم‌افزار</h3>\n<p>\n                                نرم‌افزار و درایور موردنیاز برای دسترسی\n                                به گواهی را بررسی کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۳</span>\n<h3>انتخاب عملیات</h3>\n<p>\n                                فرآیند موردنظر را در سامانه انتخاب کرده و\n                                تا مرحله امضا پیش بروید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۴</span>\n<h3>انتخاب گواهی</h3>\n<p>\n                                در پنجره انتخاب گواهی، Certificate صحیح\n                                را انتخاب کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۵</span>\n<h3>تأیید امضا</h3>\n<p>\n                                PIN را وارد کرده و درخواست امضا را\n                                تأیید کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۶</span>\n<h3>بررسی وضعیت</h3>\n<p>\n                                نتیجه عملیات را بررسی کنید تا از ثبت\n                                موفقیت‌آمیز امضا مطمئن شوید.\n                            </p>\n</div>\n</div>\n</div>\n</div>\n<!-- COMPANIES -->\n<div class=\"mg-system\" id=\"companies\">\n<div class=\"mg-system-top\">\n<div class=\"mg-system-icon\">▤</div>\n<div>\n<h2>سامانه ثبت شرکت‌ها</h2>\n<p>\n                            کاربرد گواهی امضای دیجیتال در امور ثبتی\n                        </p>\n</div>\n</div>\n<div class=\"mg-system-body\">\n<div class=\"mg-steps\">\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۱</span>\n<h3>شروع فرآیند ثبتی</h3>\n<p>\n                                فرآیند موردنظر مانند ثبت یا تغییرات شرکت\n                                را آغاز کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۲</span>\n<h3>رسیدن به مرحله امضا</h3>\n<p>\n                                در مراحل موردنیاز، سامانه درخواست\n                                امضای الکترونیکی خواهد کرد.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۳</span>\n<h3>اتصال توکن</h3>\n<p>\n                                توکن دارای گواهی را به رایانه متصل کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۴</span>\n<h3>انتخاب Certificate</h3>\n<p>\n                                گواهی صحیح مربوط به شخص امضاکننده را انتخاب کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۵</span>\n<h3>تأیید PIN</h3>\n<p>\n                                رمز توکن را وارد کرده و عملیات امضا را\n                                تأیید کنید.\n                            </p>\n</div>\n<div class=\"mg-step\">\n<span class=\"mg-step-num\">۶</span>\n<h3>تکمیل درخواست</h3>\n<p>\n                                پس از دریافت پیام موفقیت، ادامه فرآیند\n                                ثبتی را انجام دهید.\n                            </p>\n</div>\n</div>\n</div>\n</div>\n<!-- OTHER SYSTEMS -->\n<div class=\"mg-system\">\n<div class=\"mg-system-top\">\n<div class=\"mg-system-icon\">+</div>\n<div>\n<h2>سایر سامانه‌ها</h2>\n<p>\n                            الگوی عمومی استفاده از گواهی امضای دیجیتال\n                        </p>\n</div>\n</div>\n<div class=\"mg-system-body\">\n<div class=\"mg-info\">\n<p>\n                            در سایر سامانه‌هایی که از امضای دیجیتال پشتیبانی\n                            می‌کنند نیز معمولاً فرآیند کلی مشابه است:\n                            آماده‌سازی توکن و گواهی، ورود به فرآیند موردنظر،\n                            انتخاب گواهی، تأیید هویت با PIN و دریافت نتیجه\n                            نهایی عملیات.\n                        </p>\n<div class=\"mg-highlight\">\n                            اگر نام سامانه در این صفحه وجود ندارد، ابتدا\n                            راهنمای همان سامانه یا بخش پشتیبانی آن را بررسی\n                            کنید؛ زیرا روش ارتباط با گواهی دیجیتال ممکن است\n                            از یک سامانه تا سامانه دیگر متفاوت باشد.\n                        </div>\n</div>\n</div>\n</div>\n</section>\n<!-- ERROR SECTION -->\n<section class=\"mg-section section site-section\" id=\"errors\">\n<div class=\"mg-section-head section-head site-section-head\">\n<h2>رفع خطاهای رایج امضای دیجیتال</h2>\n<p>\n                    اگر سامانه گواهی شما را نمی‌شناسد یا عملیات امضا انجام نمی‌شود،\n                    موارد زیر را بررسی کنید.\n                </p>\n</div>\n<div class=\"mg-error-grid\">\n<div class=\"mg-error\">\n<span class=\"tag\">خطای شناسایی</span>\n<h3>توکن شناسایی نمی‌شود</h3>\n<p>\n                        اتصال USB، پورت دیگر، نصب بودن Driver و شناسایی\n                        توکن در نرم‌افزار مدیریت توکن را بررسی کنید.\n                    </p>\n</div>\n<div class=\"mg-error\">\n<span class=\"tag\">گواهی</span>\n<h3>Certificate نمایش داده نمی‌شود</h3>\n<p>\n                        بررسی کنید گواهی روی توکن وجود داشته باشد،\n                        معتبر باشد و نرم‌افزار واسط به آن دسترسی داشته باشد.\n                    </p>\n</div>\n<div class=\"mg-error\">\n<span class=\"tag\">PIN</span>\n<h3>رمز توکن پذیرفته نمی‌شود</h3>\n<p>\n                        از وارد کردن مکرر رمز اشتباه خودداری کنید و\n                        وضعیت قفل شدن PIN را بررسی نمایید.\n                    </p>\n</div>\n<div class=\"mg-error\">\n<span class=\"tag\">مرورگر</span>\n<h3>سامانه گواهی را نمی‌بیند</h3>\n<p>\n                        مرورگر، نرم‌افزار واسط امضا و ارتباط آن با\n                        گواهی را بررسی کنید.\n                    </p>\n</div>\n<div class=\"mg-error\">\n<span class=\"tag\">CSP</span>\n<h3>خطای CSP</h3>\n<p>\n                        درایور و Middleware مربوط به توکن را بررسی کرده\n                        و در صورت نیاز نرم‌افزارهای واسط را مجدداً نصب کنید.\n                    </p>\n</div>\n<div class=\"mg-error\">\n<span class=\"tag\">امضا</span>\n<h3>امضا نهایی نمی‌شود</h3>\n<p>\n                        گواهی صحیح، اعتبار گواهی، اتصال توکن و پیام نهایی\n                        سامانه را بررسی کنید.\n                    </p>\n</div>\n</div>\n</section>\n<!-- FAQ -->\n<section class=\"mg-section section site-section\">\n<div class=\"mg-section-head section-head site-section-head\">\n<h2>سؤالات متداول امضای دیجیتال</h2>\n</div>\n<div class=\"mg-faq\">\n<details>\n<summary>\n                        چرا سامانه گواهی امضای دیجیتال من را نمایش نمی‌دهد؟\n                    </summary>\n<div class=\"answer\">\n                        ابتدا اتصال توکن، نصب بودن Driver و Middleware،\n                        معتبر بودن گواهی و شناسایی گواهی در سیستم را بررسی کنید.\n                        سپس مرورگر و نرم‌افزار واسط را مجدداً اجرا کنید.\n                    </div>\n</details>\n<details>\n<summary>\n                        آیا برای استفاده از امضای دیجیتال حتماً توکن لازم است؟\n                    </summary>\n<div class=\"answer\">\n                        نوع روش امضا به سرویس و سامانه بستگی دارد.\n                        برخی خدمات از گواهی سخت‌افزاری روی توکن استفاده می‌کنند\n                        و برخی خدمات ممکن است روش‌های دیگری برای امضای الکترونیکی\n                        ارائه دهند.\n                    </div>\n</details>\n<details>\n<summary>\n                        چرا چند گواهی در پنجره انتخاب Certificate نمایش داده می‌شود؟\n                    </summary>\n<div class=\"answer\">\n                        ممکن است بیش از یک گواهی در سیستم یا توکن وجود داشته باشد.\n                        در این حالت باید گواهی مربوط به شخص و فرآیند موردنظر\n                        انتخاب شود.\n                    </div>\n</details>\n<details>\n<summary>\n                        PIN توکن را چند بار اشتباه وارد کردم؛ چه کار کنم؟\n                    </summary>\n<div class=\"answer\">\n                        از وارد کردن مکرر رمز خودداری کنید. وضعیت توکن و\n                        امکان قفل شدن PIN را از طریق نرم‌افزار مدیریت توکن\n                        بررسی کنید.\n                    </div>\n</details>\n<details>\n<summary>\n                        نرم‌افزار دستینه چه کاربردی دارد؟\n                    </summary>\n<div class=\"answer\">\n                        در برخی فرآیندهای امضای دیجیتال، نرم‌افزارهای واسط\n                        مانند دستینه برای ارتباط سامانه با گواهی و توکن\n                        مورد استفاده قرار می‌گیرند. نیاز به آن به سامانه\n                        و روش امضای مورد استفاده بستگی دارد.\n                    </div>\n</details>\n<details>\n<summary>\n                        آیا می‌توان از یک توکن در چند سامانه استفاده کرد؟\n                    </summary>\n<div class=\"answer\">\n                        در صورتی که توکن دارای گواهی معتبر و قابل استفاده\n                        باشد و سامانه موردنظر از همان نوع گواهی و زیرساخت\n                        پشتیبانی کند، ممکن است بتوان از آن در چند سامانه\n                        استفاده کرد.\n                    </div>\n</details>\n<details>\n<summary>\n                        تفاوت امضای دیجیتال و امضای الکترونیکی چیست؟\n                    </summary>\n<div class=\"answer\">\n                        امضای الکترونیکی مفهوم گسترده‌تری برای تأیید یا انتساب\n                        یک عملیات الکترونیکی است؛ امضای دیجیتال معمولاً بر پایه\n                        گواهی دیجیتال و زیرساخت کلید عمومی انجام می‌شود.\n                    </div>\n</details>\n<details>\n<summary>\n                        اگر ظاهر سامانه با این آموزش متفاوت باشد چه کار کنم؟\n                    </summary>\n<div class=\"answer\">\n                        ممکن است سامانه به‌روزرسانی شده باشد. عنوان و منطق\n                        مراحل را دنبال کنید؛ یعنی فرآیند را تا مرحله انتخاب\n                        گواهی، احراز هویت و تأیید نهایی امضا پیش ببرید.\n                    </div>\n</details>\n</div>\n</section>\n<!-- CTA -->\n<section class=\"mg-cta\">\n<div>\n<h2>برای استفاده از امضای دیجیتال آماده‌اید؟</h2>\n<p>\n                    اگر برای تهیه، صدور، تمدید یا راه‌اندازی گواهی امضای دیجیتال\n                    نیاز به راهنمایی دارید، از خدمات مِی‌توکن استفاده کنید.\n                </p>\n</div>\n<a href=\"/services/ </h2>\n<p>\n          مسیر دریافت گواهی به نوع گواهی و روش درخواست بستگی دارد.\n          اگر قصد دارید مراحل را خودتان انجام دهید، از مسیر زیر استفاده کنید.\n        </p>\n</div>\n<div class=\"certificate-grid\">\n<div class=\"info-card site-card\">\n<h3>\n            ۱. ثبت اطلاعات\n          </h3>\n<p>\n            اطلاعات موردنیاز خود را در فرایند درخواست وارد\n            و مشخصات را با دقت بررسی کنید.\n          </p>\n</div>\n<div class=\"info-card site-card\">\n<h3>\n            ۲. احراز هویت\n          </h3>\n<p>\n            بسته به نوع گواهی، احراز هویت متقاضی بخشی از\n            فرایند دریافت گواهی خواهد بود.\n          </p>\n</div>\n<div class=\"info-card site-card\">\n<h3>\n            ۳. ثبت درخواست\n          </h3>\n<p>\n            بر اساس نوع گواهی، مسیر مناسب درخواست را انتخاب کنید.\n            روش توکن و CSR ممکن است متفاوت باشد.\n          </p>\n</div>\n<div class=\"info-card site-card\">\n<h3>\n            ۴. دریافت کد رهگیری\n          </h3>\n<p>\n            پس از ثبت موفق درخواست، اطلاعات پیگیری درخواست\n            خود را نزد خود نگه دارید.\n          </p>\n</div>\n<div class=\"info-card site-card\">\n<h3>\n            ۵. ادامه فرایند\n          </h3>\n<p>\n            در صورت نیاز به احراز هویت یا مراجعه،\n            مراحل اعلام‌شده برای درخواست خود را انجام دهید.\n          </p>\n</div>\n<!-- VIP -->\n<div class=\"info-card vip-card site-card\">\n<h3>\n            وقت ندارم؛ گواهی می‌خواهم\n          </h3>\n<p>\n            اگر نمی‌خواهید مراحل درخواست، احراز هویت و\n            پیگیری را خودتان انجام دهید، می‌توانید از\n            خدمات VIP استفاده کنید.\n          </p>\n<a class=\"vip-card-link\" href=\"/vip/\">\n            دریافت خدمات VIP ←\n          </a>\n</div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================\n       CSR\n  ====================================== -->\n<section class=\"csr-section\" id=\"csr\">\n<div class=\"container site-container\">\n<div class=\"csr-box\">\n<div class=\"csr-content\">\n<div class=\"section-label site-label site-section-label\">\n            اگر CSR دارید\n          </div>\n<h2>\n            CSR ساختم؛ حالا باید چه کار کنم؟\n          </h2>\n<p>\n            CSR یا Certificate Signing Request، درخواست صدور\n            گواهی است که اطلاعات لازم برای صدور گواهی و کلید عمومی\n            در آن قرار می‌گیرد.\n          </p>\n<ul class=\"bullet-list\">\n<li>\n              تولید صحیح درخواست CSR\n            </li>\n<li>\n              استفاده از اطلاعات درست متقاضی یا سازمان\n            </li>\n<li>\n              ثبت CSR در مسیر مربوط به درخواست گواهی\n            </li>\n<li>\n              دریافت گواهی پس از تکمیل فرایند\n            </li>\n</ul>\n<a class=\"btn btn-red site-btn site-btn--primary\" href=\"/تولید-csr/\">\n            راهنمای تولید CSR\n            ←\n          </a>\n</div>\n<div class=\"csr-visual\">\n<div class=\"flow-item\">\n<div class=\"flow-dot\">\n              ۱\n            </div>\n<div>\n              ایجاد جفت کلید و درخواست CSR\n            </div>\n</div>\n<div class=\"flow-item\">\n<div class=\"flow-dot\">\n              ۲\n            </div>\n<div>\n              ثبت درخواست گواهی\n            </div>\n</div>\n<div class=\"flow-item\">\n<div class=\"flow-dot\">\n              ۳\n            </div>\n<div>\n              احراز هویت در صورت نیاز\n            </div>\n</div>\n<div class=\"flow-item\">\n<div class=\"flow-dot\">\n              ۴\n            </div>\n<div>\n              صدور و دریافت گواهی\n            </div>\n</div>\n<div class=\"flow-item\">\n<div class=\"flow-dot\">\n              ۵\n            </div>\n<div>\n              استفاده از گواهی در سامانه مقصد\n            </div>\n</div>\n<figure class=\"mtoken-image-placeholder mtoken-image-gica-csr\">\n<img alt=\"تصویر فرآیند CSR در سامانه GICA\" decoding=\"async\" height=\"700\" loading=\"lazy\" src=\"assets/images/placeholders/gica-csr.svg\" width=\"1000\"/>\n<figcaption>محل پیشنهادی تصویر: تصویر فرآیند CSR در سامانه GICA — 1000×700 پیکسل</figcaption>\n</figure></div>\n</div>\n</div>\n</section>\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================\n       USER QUESTIONS\n  ====================================== -->\n<section>\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n          اگر اینجا گیر کرده‌اید\n        </div>\n<h2>\n          بعد از جیکا معمولاً چه سؤالی پیش می‌آید؟\n        </h2>\n</div>\n<div class=\"questions\">\n<div class=\"question\">\n<h3>\n            کد رهگیری دارم؛ حالا چه کار کنم؟\n          </h3>\n<p>\n            کد رهگیری را نزد خود نگه دارید و بر اساس وضعیت\n            درخواست، مراحل بعدی مانند احراز هویت یا ادامه\n            فرایند را انجام دهید.\n          </p>\n</div>\n<div class=\"question\">\n<h3>\n            CSR ساختم؛ کجا باید واردش کنم؟\n          </h3>\n<p>\n            CSR باید در مسیر مربوط به درخواست گواهی استفاده شود.\n            قبل از ارسال، اطلاعات درخواست و مشخصات موجود در CSR\n            را بررسی کنید.\n          </p>\n</div>\n<div class=\"question\">\n<h3>\n            گواهی گرفتم، ولی سامانه آن را نمی‌شناسد.\n          </h3>\n<p>\n            نصب بودن گواهی، وجود کلید خصوصی، نرم‌افزار یا\n            Middleware موردنیاز، مرورگر و تنظیمات سامانه مقصد\n            را بررسی کنید.\n          </p>\n</div>\n<div class=\"question\">\n<h3>\n            توکن خریدم؛ قدم بعدی چیست؟\n          </h3>\n<p>\n            خرید توکن به معنی صدور گواهی روی آن نیست.\n            در ادامه باید فرایند دریافت گواهی موردنیاز خود را\n            انجام دهید و سپس از توکن برای استفاده از کلید خصوصی\n            و گواهی استفاده کنید.\n          </p>\n</div>\n<div class=\"question\">\n<h3>\n            برای سامانه مودیان آمده‌ام؛ از کجا شروع کنم؟\n          </h3>\n<p>\n            ابتدا مشخص کنید دقیقاً برای کدام بخش از فرایند\n            مالیاتی به گواهی یا CSR نیاز دارید. سپس بر اساس\n            الزامات همان فرای /div>\n<!-- ================= INTRO ================= -->\n<section class=\"intro\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        قبل از شروع\n      </div>\n<h2>\n        جیکا دقیقاً چه کاری برای شما انجام می‌دهد؟\n      </h2>\n<p>\n        جیکا سامانه‌ای برای فرایندهای مرتبط با گواهی‌های الکترونیکی است.\n        بسته به نوع گواهی و کاربرد شما، ممکن است بخشی از مراحل به صورت\n        غیرحضوری و بخشی از طریق احراز هویت یا مراجعه به دفتر ثبت‌نام انجام شود.\n      </p>\n</div>\n<div class=\"intro-box\">\n<p>\n        اگر برای سامانه مودیان، سامانه ستاد، جامع تجارت یا سایر سامانه‌های\n        مبتنی بر امضای دیجیتال به گواهی نیاز دارید، ابتدا مشخص کنید\n        <strong>گواهی را برای چه کاری می‌خواهید</strong> و آیا توکن سخت‌افزاری\n        در اختیار دارید یا خیر.\n      </p>\n<div class=\"intro-points\">\n<div class=\"intro-point\">\n<strong>گواهی می‌خواهم</strong>\n<span>\n            مسیر ثبت درخواست و دریافت گواهی را دنبال کنید.\n          </span>\n</div>\n<div class=\"intro-point\">\n<strong>توکن دارم</strong>\n<span>\n            می‌توانید روی دریافت گواهی و مراحل مرتبط با آن تمرکز کنید.\n          </span>\n</div>\n<div class=\"intro-point\">\n<strong>توکن ندارم</strong>\n<span>\n            ابتدا توکن موردنیاز خود را تهیه کنید.\n          </span>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= LOGIN ================= -->\n<section id=\"login\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        ورود\n      </div>\n<h2>\n        اگر فقط می‌خواهید وارد سامانه جیکا شوید\n      </h2>\n<p>\n        برای ورود به بخش متقاضیان گواهی الکترونیکی می‌توانید از لینک رسمی سامانه استفاده کنید.\n      </p>\n</div>\n<div class=\"path-box\">\n<h3>\n        ورود به سامانه جیکا\n      </h3>\n<p>\n        برای ورود و ادامه فرایند، از سامانه رسمی جیکا استفاده کنید.\n        ساختار و گزینه‌های سامانه ممکن است در طول زمان تغییر کند.\n      </p>\n<a class=\"btn btn-primary site-btn site-btn--primary\" href=\"https://www.gica.ir/totalca\" rel=\"noopener\" target=\"_blank\">\n        ورود به جیکا ←\n      </a>\n</div>\n</div>\n</section>\n<!-- ================= CERTIFICATE ================= -->\n<section class=\"steps\" id=\"certificate\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        دریافت گواهی\n      </div>\n<h2>\n        اگر گواهی امضای دیجیتال می‌خواهید\n      </h2>\n<p>\n        مسیر کلی دریافت گواهی شامل ثبت اطلاعات، احراز هویت، ثبت درخواست\n        و ادامه فرایند تا دریافت گواهی است.\n      </p>\n</div>\n<div class=\"steps-grid\">\n<div class=\"step\">\n<div class=\"step-num\">۱</div>\n<h3>\n          ثبت اطلاعات\n        </h3>\n<p>\n          اطلاعات موردنیاز خود را در سامانه وارد و حساب کاربری ایجاد یا تکمیل کنید.\n        </p>\n</div>\n<div class=\"step\">\n<div class=\"step-num\">۲</div>\n<h3>\n          احراز هویت\n        </h3>\n<p>\n          بسته به نوع درخواست، احراز هویت به صورت غیرحضوری یا از مسیر تعیین‌شده انجام می‌شود.\n        </p>\n</div>\n<div class=\"step\">\n<div class=\"step-num\">۳</div>\n<h3>\n          ثبت درخواست گواهی\n        </h3>\n<p>\n          نوع گواهی و روش درخواست را مطابق نیاز خود انتخاب کنید.\n        </p>\n</div>\n<div class=\"step\">\n<div class=\"step-num\">۴</div>\n<h3>\n          دریافت کد رهگیری\n        </h3>\n<p>\n          پس از تکمیل موفق درخواست، اطلاعات پیگیری درخواست را نزد خود نگه دارید.\n        </p>\n</div>\n<div class=\"step\">\n<div class=\"step-num\">۵</div>\n<h3>\n          ادامه فرایند\n        </h3>\n<p>\n          در صورت نیاز، مراحل احراز هویت، مراجعه به دفتر یا سایر اقدامات اعلام‌شده را انجام دهید.\n        </p>\n</div>\n<div class=\"step\">\n<div class=\"step-num\">۶</div>\n<h3>\n          دریافت گواهی\n        </h3>\n<p>\n          پس از تکمیل فرایند صدور، گواهی را مطابق روش اعلام‌شده دریافت و در محیط موردنظر استفاده کنید.\n        </p>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= USER PATH ================= -->\n<section class=\"path-section\">\n<div class=\"container site-container\">\n<div class=\"path-box\">\n<h3>\n        کدام حالت برای شماست؟\n      </h3>\n<p>\n        اگر هنوز نمی‌دانید مرحله بعدی چیست، ابتدا وضعیت خودتان را مشخص کنید.\n      </p>\n<div class=\"path-items\">\n<div class=\"path-item\">\n<strong>توکن دارم، گواهی می‌خواهم</strong>\n<span>\n            توکن را آماده داشته باشید و فرایند دریافت گواهی را ادامه دهید.\n          </span>\n</div>\n<div class=\"path-item\">\n<strong>CSR دارم</strong>\n<span>\n            اگر CSR برای شما تولید شده است، بر اساس نوع درخواست آن را در فرایند مربوط استفاده کنید.\n          </span>\n</div>\n<div class=\"path-item\">\n<strong>وقت ندارم؛ گواهی می‌خواهم</strong>\n<span>\n            اگر نمی‌خواهید مراحل را شخصاً انجام دهید، می‌توانید از خدمات VIP استفاده کنید.\n          </span>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= CSR ================= -->\n<section class=\"csr\" id=\"csr\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        CSR\n      </div>\n<h2>\n        اگر CSR دارید یا باید CSR بسازید\n      </h2>\n<p>\n        CSR یکی از روش‌های متداول درخواست گواهی است و در برخی فرایندها،\n        اطلاعات کلید عمومی و مشخصات درخواست را در اختیار مرکز صدور قرار می‌دهد.\n      </p>\n</div>\n<div class=\"csr-box\">\n<div class=\"csr-card\">\n<h3>\n          CSR ساختم؛ حالا چه کار کنم؟\n        </h3>\n<p>\n          اگر فایل CSR در اختیار شماست، آن را برای فرایندی که گواهی را\n          برای آن درخواست کرده‌اید استفاده کنید. محل و روش ثبت CSR\n          به نوع گواهی و سامانه مربوط بستگی دارد.\n        </p>\n<a class=\"csr-link\" href=\"/تولید-csr/\">\n          راهنمای تولید و استفاده از CSR ←\n        </a>\n</div>\n<div class=\"csr-card\">\n<h3>\n          CSR برای سامانه مودیان\n        </h3>\n<p>\n          در فرایندهای مرتبط با سامانه مودیان، CSR و کلید عمومی می‌توانند\n          در مراحل مربوط به دریافت گواهی و شناسه یکتا مورد استفاده قرار گیرند.\n          اگر برای مودیان به CSR نیاز دارید، مسیر اختصاصی آن را دنبال کنید.\n        </p>\n<a class=\"csr-link\" href=\"/تولید-csr/\">\n          راهنمای CSR برای مودیان ←\n        </a>\n</div>\n<figure class=\"mtoken-image-placeholder mtoken-image-gica-certificate\">\n<img alt=\"تصویر ارتباط گواهی دیجیتال و توکن\" decoding=\"async\" height=\"650\" loading=\"lazy\" src=\"assets/images/placeholders/gica-certificate.svg\" width=\"1000\"/>\n<figcaption>محل پیشنهادی تصویر: تصویر ارتباط گواهی دیجیتال و توکن — 1000×650 پیکسل</figcaption>\n</figure></div>\n</div>\n</section>\n<!-- ================= SYSTEMS ================= -->\n<section id=\"systems\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        کاربرد گواهی\n      </div>\n<h2>\n        گواهی جیکا در چه سامانه‌هایی استفاده می‌شود؟\n      </h2>\n<p>\n        نوع استفاده از گواهی به سامانه و فرایندی که در آن فعالیت می‌کنید بستگی دارد.\n      </p>\n</div>\n<div class=\"systems-grid\">\n<div class=\"system-card site-card\">\n<div class=\"system-top\">\n<div class=\"system-icon\">ت</div>\n<h3>سامانه جامع تجارت ایران</h3>\n</div>\n<p>\n          استفاده از گواهی و امضای دیجیتال در فرایندهای مرتبط با تجارت و ثبت سفارش.\n        </p>\n</div>\n<div class=\"system-card site-card\">\n<div class=\"system-top\">\n<div class=\"system-icon\">س</div>\n<h3>سامانه تدارکات الکترونیکی دولت «ستاد»</h3>\n</div>\n<p>\n          شرکت در مناقصه و مزایده، ثبت‌نام تأمین‌کننده و امضای اسناد الکترونیکی.\n        </p>\n</div>\n<div class=\"system-card site-card\">\n<div class=\"system-top\">\n<div class=\"system-icon\">م</div>\n<h3>سامانه امور مالیاتی</h3>\n</div>\n<p>\n          فرایندهای مرتبط با CSR، گواهی دیجیتال و شناسه یکتا مالیاتی.\n        </p>\n</div>\n<div class=\"system-card site-card\">\n<div class=\"system-top\">\n<div class=\"system-icon\">ب</div>\n<h3>بانکداری اینترنتی بانک ملت</h3>\n</div>\n<p>\n          استفاده از امضای دیجیتال و توکن در برخی خدمات و فرایندهای بانکی.\n        </p>\n</div>\n<div class=\"system-card site-card\">\n<div class=\"system-top\">\n<div class=\"system-icon\">ر</div>\n<h3>سازمان راهداری</h3>\n</div>\n<p>\n          استفاده از توکن و گواهی دیجیتال در فرایندهای الکترونیکی مرتبط.\n        </p>\n</div>\n<div class=\"system-card site-card\">\n<div class=\"system-top\">\n<div class=\"system-icon\">PKI</div>\n<h3>سایر سامانه‌های مبتنی بر PKI</h3>\n</div>\n<p>\n          کاربرد گواهی و کلید خصوصی در سامانه‌هایی که از زیرساخت کلید عمومی پشتیبانی می‌کنند.\n        </p>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= TOKEN ================= -->\n<section class=\"token\" id=\"token\">\n<div class=\"container site-container\">\n<div class=\"token-box\">\n<div>\n<h2>\n          اگر توکن می‌خواهید\n        </h2>\n<p>\n          اگر برای نگهداری کلید خصوصی و استفاده از امضای دیجیتال به توکن\n          سخت‌افزاری نیاز دارید، می‌توانید توکن mToken K3 را تهیه کنید.\n          <strong>خرید توکن مستقل از خدمات راه‌اندازی و صدور گواهی است.</strong>\n          یعنی اگر قصد دارید مراحل دریافت گواهی را شخصاً انجام دهید،\n          فقط توکن را سفارش دهید و مراحل گواهی را از مسیر مربوط دنبال کنید.\n        </p>\n</div>\n<div class=\"token-buttons\">\n<a class=\"token-btn\" href=\"https://mtoken.ir/product/%d8%aa%d9%88%da%a9%d9%86-mtoken-k3/\">\n          خرید توکن mToken K3\n        </a>\n<a class=\"token-btn secondary\" href=\"https://mtoken.ir/%d8%b3%d8%a7%d9%85%d8%a7%d9%86%d9%87-%d8%b3%d8%aa%d8%a7%d8%af/\">\n          راهنمای استفاده از توکن\n        </a>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= QUESTIONS ================= -->\n<section>\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        بعد از ثبت درخواست\n      </div>\n<h2>\n        چند سؤال که معمولاً بعد از ورود به جیکا پیش می‌آید\n      </h2>\n</div>\n<div class=\"guide-grid\">\n<div class=\"guide-card\">\n<div class=\"guide-number\">۱</div>\n<h3>\n          کد رهگیری دارم؛ حالا چه کار کنم؟\n        </h3>\n<p>\n          کد رهگیری را نگه دارید و ادامه مراحل درخواست را مطابق\n          پیام‌ها و وضعیت درخواست در سامانه دنبال کنید.\n        </p>\n</div>\n<div class=\"guide-card\">\n<div class=\"guide-number\">۲</div>\n<h3>\n          CSR ساختم؛ کجا باید واردش کنم؟\n        </h3>\n<p>\n          محل ثبت CSR به نوع گواهی و فرایند مربوط بستگی دارد.\n          ابتدا مشخص کنید گواهی برای کدام سامانه یا کاربرد درخواست شده است.\n        </p>\n</div>\n<div class=\"guide-card\">\n<div class=\"guide-number\">۳</div>\n<h3>\n          گواهی گرفتم ولی سامانه آن را نمی‌شناسد\n        </h3>\n<p>\n          معمولاً باید زنجیره گواهی، توکن، درایور یا Middleware،\n          مرورگر و تنظیمات موردنیاز سامانه بررسی شود.\n        </p>\n</div>\n<div class=\"guide-card\">\n<div class=\"guide-number\">۴</div>\n<h3>\n          توکن خریدم؛ قدم بعدی چیست؟\n        </h3>\n<p>\n          خرید توکن به‌تنهایی به معنی صدور گواهی نیست.\n          پس از تهیه توکن، باید فرایند دریافت گواهی موردنیاز خود را انجام دهید.\n        </p>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= ERRORS ================= -->\n<section class=\"errors\" style=\"background:var(--light);\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        عیب‌یابی\n      </div>\n<h2>\n        اگر در جیکا به مشکل خوردید\n      </h2>\n<p>\n        قبل از تکرار چندباره درخواست، مشخص کنید مشکل دقیقاً در کدام مرحله اتفاق افتاده است.\n      </p>\n</div>\n<div class=\"errors-grid\">\n<div class=\"error-card\">\n<strong>ورود انجام نمی‌شود</strong>\n<span>\n          اطلاعات ورود و روش احراز هویت انتخاب‌شده را بررسی کنید.\n        </span>\n</div>\n<div class=\"error-card\">\n<strong>درخواست ثبت نمی‌شود</strong>\n<span>\n          کامل بودن اطلاعات و الزامات همان نوع گواهی را بررسی کنید.\n        </span>\n</div>\n<div class=\"error-card\">\n<strong>CSR پذیرفته نمی‌شود</strong>\n<span>\n          CSR صحیح، کامل و مربوط به فرایند موردنظر را بررسی کنید.\n        </span>\n</div>\n<div class=\"error-card\">\n<strong>گواهی در سامانه دیده نمی‌شود</strong>\n<span>\n          توکن، Middleware، گواهی‌های زنجیره و تنظیمات سامانه را بررسی کنید.\n        </span>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= VIP ================= -->\n<section class=\"vip\">\n<div class=\"container site-container\">\n<div class=\"vip-box\">\n<div class=\"vip-content\">\n<div class=\"vip-icon\">\n          ✓\n        </div>\n<div>\n<h3>\n            وقت ندارم مراحل گواهی را انجام بدهم؛\n            <span>گواهی می‌خواهم</span>\n</h3>\n<p>\n            اگر نمی‌خواهید درگیر ثبت درخواست، احراز هویت و پیگیری مراحل شوید،\n            می‌توانید انجام فرایند را به ما بسپارید.\n          </p>\n</div>\n</div>\n<div class=\"vip-action\">\n<a class=\"vip-link\" href=\"/vip/\">\n          خدمات VIP دریافت گواهی ←\n        </a>\n</div>\n</div>\n</div>\n</section>\n<!-- ================= FAQ ================= -->\n<section class=\"faq\">\n<div class=\"container site-container\">\n<div class=\"section-head site-section-head\">\n<div class=\"section-label site-label site-section-label\">\n        پرسش‌های متداول\n      </div>\n<h2>\n        سوالات متداول درباره سامانه جیکا\n      </h2>\n</div>\n<div class=\"faq-list\">\n<details>\n<summary>\n          سامانه جیکا چیست؟\n        </summary>\n<p>\n          جیکا سامانه مرتبط با فرایندهای گواهی‌های الکترونیکی است\n          که متقاضیان می‌توانند از طریق آن برای دریافت و پیگیری\n          گواهی‌های موردنیاز خود اقدام کنند.\n        </p>\n</details>\n<details>\n<summary>\n          برای ورود به سامانه جیکا از کجا وارد شوم؟\n        </summary>\n<p>\n          برای ورود به بخش متقاضیان گواهی الکترونیکی می‌توانید از\n          لینک رسمی جیکا در ابتدای همین صفحه استفاده کنید.\n        </p>\n</details>\n<details>\n<summary>\n          آیا برای دریافت گواهی جیکا حتماً باید توکن داشته باشم؟\n        </summary>\n<p>\n          نوع گواهی و روش درخواست تعیین می‌کند چه تجهیز یا روشی لازم است.\n          در مواردی که گواهی برای استفاده در توکن سخت‌افزاری درخواست می‌شود،\n          داشتن توکن موردنیاز است.\n        </p>\n</details>\n<details>\n<summary>\n          آیا خرید توکن به خدمات VIP وابسته است؟\n        </summary>\n<p>\n          خیر. خرید توکن مستقل است. اگر قصد دارید خودتان مراحل دریافت\n          گواهی را انجام دهید، می‌توانید فقط توکن را خریداری کنید.\n        </p>\n</details>\n<details>\n<summary>\n          CSR جیکا چیست؟\n        </summary>\n<p>\n          CSR یک درخواست گواهی دیجیتال است که شامل اطلاعات درخواست\n          و کلید عمومی مربوط به جفت‌کلید است. در برخی فرایندهای دریافت\n          گواهی، CSR برای ثبت درخواست مورد استفاده قرار می‌گیرد.\n        </p>\n</details>\n<details>\n<summary>\n          بعد از دریافت گواهی چه کاری باید انجام دهم؟\n        </summary>\n<p>\n          گواهی باید در محیط موردنیاز شما مورد استفاده قرار گیرد.\n          بسته به سامانه، ممکن است توکن، Middleware، مرورگر یا تنظیمات\n          خاصی لازم باشد.\n        </p>\n</details>\n<details>\n<summary>\n          آیا گواهی جیکا برای سامانه مودیان استفاده می‌شود؟\n        </summary>\n<p>\n          گواهی دیجیتال و کلیدهای مرتبط می‌توانند در فرایندهای سامانه\n          مودیان مورد استفاده قرار گیرند. الزامات دقیق به نوع فرایند\n          و روش انتخاب‌شده بستگی دارد.\n        </p>\n</details>\n</div>\n</div>\n</section>\n<!-- ================= FINAL CTA ================= -->\n<section class=\"final\">\n<div class=\"container site-container\">\n<h2>\n      آماده‌اید از جیکا شروع کنید؟\n    </h2>\n<p>\n      اگر برای دریافت گواهی امضای دیجیتال به جیکا رسیده‌اید،\n      ابتدا مسیر موردنیاز خود را مشخص کنید و سپس وارد سامانه رسمی شوید.\n    </p>\n<a class=\"final-btn\" href=\"https://www.gica.ir/totalca\" rel=\"noopener\" target=\"_blank\">\n      ورود به سامانه جیکا ←\n    </a>\n</div>\n</section>\n<!-- ================= FAQ SCHEMA ================= -->\n</div>\n<!-- /wp:html -->\n","csr":"<!-- wp:html -->\n<div class=\"mtoken-gutenberg-page mtoken-page-csr\">\n<!-- /wp:html -->\n<!-- wp:html -->\n<!-- =====================================================\n       HERO\n  ===================================================== -->\n<section class=\"csr-hero\">\n<div class=\"container site-container\">\n<div class=\"hero-grid\">\n<div class=\"hero-content\">\n<div class=\"eyebrow site-label\">\n<span></span>\n            تولید CSR و آماده‌سازی گواهی دیجیتال\n          </div>\n<h1>\n            تولید کلید و CSR را\n            <strong>به ما بسپارید</strong>\n</h1>\n<p>\n            برای فرآیندهای مرتبط با سامانه مودیان و شناسه یکتای مالیاتی،\n            یا برای گواهی SSL و استفاده روی سرور، بخش فنی کار را\n            بدون درگیری با تنظیمات پیچیده انجام دهید.\n          </p>\n<div class=\"hero-actions\">\n<!-- شماره تماس را اینجا جایگزین کنید -->\n<a class=\"btn btn-primary site-btn site-btn--primary\" href=\"tel:09128698052\">\n              ☎ تماس با کارشناسان\n            </a>\n<a class=\"btn btn-outline site-btn site-btn--outline\" href=\"#services\">\n              مشاهده خدمات\n            </a>\n</div>\n<div class=\"hero-contact-note\">\n            برای شروع، کافی است نوع نیاز خود را با کارشناسان مطرح کنید.\n          </div>\n</div>\n<div class=\"hero-visual\">\n<div class=\"certificate-card\">\n<div class=\"certificate-top\">\n<div class=\"certificate-logo\">\n                ✓\n              </div>\n<div class=\"status\">\n                آماده درخواست\n              </div>\n</div>\n<div class=\"certificate-title\">\n              Digital Certificate\n            </div>\n<div class=\"certificate-subtitle\">\n              CSR &amp; Certificate Preparatio
